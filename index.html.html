mampuan nalar kritis peserta didik dalam menganalisis perbedaan pendapat dan mengekspresikan akidah Islam dengan benar, sesuai dengan kemajemukan bangsa Indonesia melalui sikap wasathiyah meliputi tawasuth, i’tidal, tasamuh, dan tawazun; 3. Membentuk peserta didik agar menjadi pribadi yang berakhlak mulia, menghiasi diri dengan perilaku terpuji (mahmudah), dan menghindarkan diri dari perilaku tercela (madzmumah) dalam kehidupan sehari-hari dengan latihan kejiwaan melalui mujahadah dan riyadah; 4. Membentuk peserta didik yang menjunjung tinggi nilai persatuan sehingga dapat menguatkan persaudaraan seagama (ukhuwah Islamiyyah), persaudaraan sebangsa dan senegara (ukhuwah wathaniyah, dan juga persaudaraan kemanusiaan (ukhuwah basyariyah)."},"ilmu_kalam":{"judul":"Ilmu Kalam (MA Program Keagamaan)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Akidah","cp":"Memahami sejarah dan prinsip-prinsip akidah Islam, melalui 'Aqaidul Khomsin dan al-Asma' al-Husna."}],"F":[{"nama":"Aliran Pemikiran Kalam","cp":"Memahami pemikiran Ilmu Kalam meliputi: konsep Ilmu Kalam, dalil dan istidlal aliran Ilmu Kalam dalam mengeluarkan pendapatnya tentang: kejadian Isra' Mi'raj, kiamat dan fase-fase kehidupan di akhirat, kedudukan antara wahyu dan akal dalam beragama, pengaruh dosa besar terhadap eksistensi keimanan, kehendak dan perbuatan Allah Swt. hubungannya dengan ikhtiar, kedudukan Allah Swt., dan kalamullah."},{"nama":"Pemikiran Ulama Nusantara","cp":"Memahami pemikiran ulama nusantara dalam hal Ilmu Kalam (Mufti Betawi Sayyid Utsman bin Yahya, Syaikh Muhammad Yasin al-Fadani, Syaikh Nawawi al-Bantani, Tuanku Zainuddin Abdul Majid dan Kyai Ahmad Dahlan dan Kyai Hasyim Asy'ari) serta pengaruhnya terhadap gerakan Islam di nusantara."}]},"tujuan":"Pada praktiknya, pembelajaran Ilmu Kalam ditujukan untuk: 1. Memperkokoh akidah Ahlus Sunnah wal Jama’ah, dan keimanan, peserta didik sebagai dasar, landasan, dan motivasi beraktifitas sehari-hari sehingga semua perilakunya bernilai ibadah dan berdimensi ukhrawi. 2. Mengkonstruksi kemampuan nalar kritis peserta didik dalam menganalisa perbedaan pendapat dan corak pemikiran kalam untuk memperkokoh akidah agar tidak terombang-ambing akidah lain serta memperluas wawasan keimanan sehingga dapat bersikap fleksibel, toleran, dan saling menghargai keyakinan yang berbeda. 3. Mengekspresikan akidah Islam Ahlus Sunnah wal Jama’ah dengan benar, sesuai dengan kemajemukan bangsa Indonesia melalui sikap moderat meliputi tawasuth, i’tidal, tasamuh, dan tawazun sehingga dapat menguatkan persaudaraan seagama (ukhuwah Islamiyah), persaudaraan sebangsa dan senegara (ukhuwah wathaniyah), dan juga persaudaraan kemanusiaan (ukhuwah basyariyah) dalam konteks kehidupan bermasyarakat, berbangsa, dan benegara dalam kebhinekaan global."},"tasawuf":{"judul":"Akhlak Tasawuf (MA Program Keagamaan)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Konsep Tasawuf","cp":"Memahami konsep tasawuf, dan hubungannya dengan akhlak dan fikih serta keterkaitan antara syari'at, thariqah, dan hakikat sebagai fondasi dasar tasawuf yang benar; konsep tasawuf falasafi serta tokok-tokoh dan pokok-pokok ajaran tasawuf akhlaki/amali dan tasawuf falsafi serta tokoh-tokoh dan pokok-pokok ajaran tasawuf (Hasan al-Basri, Abu Yazid al-Bustami, Rabi'ah al-Adawiyah, Zun Nun al-Misri, Junaid al-Bagdadi, al-Halllaj, Muhyiddin Ibnu Arabi, dan al-Ghazali)."}],"F":[{"nama":"Tazkiyatun Nufus","cp":"Memahami konsep nafsu, akal, dan qalb serta hubungannya dengan perbuatan manusia sebagai pengenalan diri dan mempraktikkan tazkiyatun nufus dengan cara mujahadah dan riyadah secara nyata dalam kehidupan sehari-hari."},{"nama":"Maqamat dan Ahwal","cp":"Memahami konsep maqamat dan ahwal."},{"nama":"Tarikat","cp":"Memahami konsep dan sejarah perkembangan tarikat di dalam Islam berikut pokok-pokok ajaran tarikat mu'tabarah di Nusantara meliputi tarikat Qadiriyah, Naqsabandiyah, Qadiriyah wa Naqsabandiayah (TQN), Syaziliyah, Syatariyah, Khalwatiyah, Tijaniyah, dan Samaniyah beserta tokoh-tokohnya."}]},"tujuan":"Pada praktiknya pembelajaran mata pelajaran Akhlak Tasawuf bertujuan untuk: 1. Mengkonstruksi kemampuan nalar kritis peserta didik dalam mengenali kondisi jiwa/hati, menganalisis bahaya hawa nafsu, maksiat lahir dan batin bagi kehidupan pribadi dan sosial masyarakat. 2. Memberikan bimbingan kepada peserta didik agar memiliki spiritualitas yang baik dengan mengaitkan sikap dan perilakunya dalam merespon semua situasi dan kondisi yang dihadapi dengan rida Allah Swt. untuk menggapai kebahagiaan dunia sekaligus akhirat. 3. Membentuk akhlak peserta didik yang berkualitas dengan menerapkan akhlak terpuji dan menghindari akhlak tercela dalam kehidupan sehari-hari, bersikap kasih sayang kepada orang lain, baik dalam hubungannya dengan pencipta, diri sendiri, sesama warga negara, sesama manusia serta alam semesta dalam wadah Negara Kesatuan Republik Indonesia."},"fikih":{"judul":"Fikih (MA)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Fikih Ibadah","cp":"Memahami berbagai masalah dalam pelaksanaan ibadah yang mencakup thaharah, salat dalam berbagai situasi, puasa, zakat profesi dan wakaf beserta pengelolaannya, persoalan haji dan umroh, praktik pemulasaraan jenazah, sertifikasi halal dan penyembelihan hewan."},{"nama":"Fikih Muamalah","cp":"Memahami konsep Islam tentang kepemilikan dan perpindahannya, kerjasama dan permodalan, perbankan syari'ah, dan transaksi online."}],"F":[{"nama":"Fikih Muamalah","cp":"Memahami konsep Islam tentang jinayah, hudud, bughat, riddah, peradilan dan konsep Islam tentang perkawinan, talak, rujuk, waris, wasiat dan ilmu faraid serta implementasinya dalam konteks keindonesiaan yang majemuk."},{"nama":"Ushul Fikih","cp":"Memahami konsep dasar fikih dan ushul fikih, penerapan sumber hukum Islam yang muttafaq alaih (disepakati) dan mukhtalaf fihi (tidak disepakati), berijtihad dan bermazhab, al-hakim, al-hukmu, al-mahkum fih, dan al-mahkum 'alaih, al-qawa'idul fiqhiyyah dan al-qawa'idul ushuliyyah."}]},"tujuan":"Pembelajaran Fikih di madrasah secara bertahap dan holistik diarahkan untuk menyiapkan peserta didik yang memiliki kompetensi memahami hukum-hukum Islam sehingga memungkinkan peserta didik menjalankan kewajiban beragama dengan baik terkait hubungan dengan Allah Swt., maupun sesama manusia dan alam semesta. Pemahaman keagamaan tersebut terinternalisasi dalam diri peserta didik, sehingga nilai-nilai agama menjadi pertimbangan dalam cara berpikir, bersikap dan bertindak untuk menyikapi fenomena kehidupan. Selain itu, peserta didik diharapkan mampu mengekspresikan pemahaman agamanya dalam hidup bersama yang multikultural, multietnis, multipaham keagamaan dan kompleksitas kehidupan lainnya secara bertanggung jawab, toleran, dan moderat dalam kerangka berbangsa dan bernegara Indonesia yang berdasarkan Pancasila dan Undang-Undang Dasar 1945."},"fikih_mapk":{"judul":"Fikih (MA Program Keagamaan)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Fikih Ibadah","cp":"Memahami dalil dan istidlal fuqaha dalam permasalahan thaharah, haid, nifas, salat, zakat, pemulasaraan jenazah, puasa, haji dan umrah, kurban, akikah, ketentuan penyembelihan hewan ternak, berburu hewan liar, dan sertifikasi halal."}],"F":[{"nama":"Fikih Muamalah","cp":"Memahami dalil dan istidlal fuqaha tentang macam-macam kepemilikan dan perpindahannya serta hal-hal yang dilarang, macam-macam kerjasama dan permodalan, perbankan syari'ah, dan transaksi online. Memahami ketentuan jinayah, hudud, bughat, riddah dan ketentuan peradilan dalam Islam serta implementasinya dalam konteks masyarakat yang majemuk dalam bingkai Islam yang rahmatan lil ’alamin. Memahami konsep Islam tentang perkawinan, talak, rujuk, nusyuz, wasiat, Ilmu Waris dan implementasinya dalam konteks keindonesiaan berupa Undang-undang Perkawinan."}]},"tujuan":"Pembelajaran Fikih di madrasah secara bertahap dan holistik diarahkan untuk menyiapkan peserta didik yang memiliki kompetensi memahami hukum-hukum Islam sehingga memungkinkan peserta didik menjalankan kewajiban beragama dengan baik terkait hubungan dengan Allah Swt., maupun sesama manusia dan alam semesta. Pemahaman keagamaan tersebut terinternalisasi dalam diri peserta didik, sehingga nilai-nilai agama menjadi pertimbangan dalam cara berpikir, bersikap, dan bertindak untuk menyikapi fenomena kehidupan. Selain itu, peserta didik diharapkan mampu mengamalkan dan menyebarkan pemahaman agamanya kepada orang lain dalam hidup bersama yang multikultural, multietnis, multipaham keagamaan dan kompleksitas kehidupan lainnya secara bertanggung jawab, toleran, dan moderat dalam kerangka berbangsa dan bernegara Indonesia yang berdasarkan Pancasila dan Undang-Undang Dasar 1945."},"ushul":{"judul":"Ushul Fikih (MA Program Keagamaan)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[],"F":[{"nama":"Sejarah Fikih dan Ushul Fikih","cp":"Memahami konsep fikih dan ushul fikih, tujuan dan ruang lingkupnya, sejarah pertumbuhan dan perkembangan fikih dan ushul fikih, dan mazhab dalam fikih dan ushul fikih."},{"nama":"Sumber Hukum Islam","cp":"Memahami fungsi dan kedudukan sumber hukum yang disepakati (Al-Qu’ran, Hadis, ijma’, qiyas), dan sumber hukum yang diperselisihkan (istihsan, mashlahah mursalah, ‘urf, istishab, syar’u man qablana, dalalatul iqtiran, saddudz dzari’ah dan mazhab shahabiy)."},{"nama":"Hukum Syar’i","cp":"Memahami konsep al-hakim, al-hukmu, al-mahkum fih dan al-mahkum ‘alaih."},{"nama":"Kaidah Ushul Fikih","cp":"Memahami ketentuan kaidah amr dan nahi, ‘am dan khas, takhsis dan mukhassis, mujmal dan mubayyan, muradif dan musytarak, mutlaq dan muqayyad, zahir dan takwil, manthuq dan mafhum serta implikasinya terhadap proses istinbath hukum dari Al-Qur’an dan Hadis."},{"nama":"Ijtihad","cp":"Memahami ketentuan ijtihad beserta perangkat-perangkatnya seperti nasikh dan mansukh, ta’arudhul adillah, tarjih, maupun sikap terhadap produk ijtihad seperti ittiba’, taqlid, dan talfiq sehingga tercipta pemahaman yang utuh serta sikap kritis dan selektif terhadap fatwa ulama sesuai konteks keindonesiaan dan global."},{"nama":"Kaidah Pokok Fikih","cp":"Memahami konsep dan penerapan lima kaidah pokok fikih (al-umuru bi maqashidiha, al-yaqinu la yuzalu bisy-syak, al-masyaqqatu tajlibut-taysir, adh-dhararu yuzal, dan al- ‘adatu muhakkamah)."}]},"tujuan":"Pembelajaran Ushul Fikih di Madrasah Aliyah Peminatan Keagamaan ditujukan agar peserta didik mengetahui tentang: 1. Sumber-sumber hukum Islam yang digunakan oleh para ulama untuk memecahkan permasalahan yang dihadapinya. Pengetahuan tentang sumber hukum ini akan memotivasi peserta didik untuk berpikir terbuka dan inklusif. 2. Instrumen-instrumen yang diperlukan oleh seorang mujtahid untuk dapat menganalisis sebuah permasalahan dalam hukum Islam. Pemahaman terhadap instrumen ini akan mendorong peserta didik untuk berpikir kritis terhadap sebuah hukum yang difatwakan oleh seorang ulama dalam menyikapi sebuah permasalahan sosial keagamaan. 3. Kaidah-kaidah dalam Fikih dan Ushul Fikih yang bersifat praktis yang dapat digunakan untuk menganalisa sebuah persoalan yang muncul berdasarkan ajaran Islam. Pemahaman terhadap kaidah ini sangat berguna dalam membekali peserta didik untuk menghadapi fenomena kehidupan yang penuh dinamika. Persoalan yang akan dihadapi peserta didik di masa depan akan sangat dinamis sehingga membutuhkan analisa yang cepat dan tepat serta tidak menyimpang dari ajaran Islam. 4. Syarat-syarat dan tingkatan mujtahid dalam Islam yang diperlukan untuk membentuk sikap kritis dan selektif dalam mengikuti sebuah pendapat ulama. Peserta didik akan mengetahui kepada siapa seharusnya dia belajar dan siapa (ulama) yang seharusnya dijadikan panutan."},"ski":{"judul":"Sejarah Kebudayaan Islam (MA)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Periode Rasulullah Saw.","cp":"Memahami kebudayaan masyarakat Mekah dan Madinah sebelum Islam, substansi dan strategi dakwah Rasulullah Saw. periode Mekah dan Madinah, peristiwa hijrah yang dilakukan Rasulullah Saw. dan para shahabat, substansi Piagam Madinah (Misaq al-Madinah), dan faktor-faktor keberhasilan Fathu Makkah sebagai inspirasi dalam meneladani perilaku mulia Rasulullah Saw. di kehidupan masa kini dan masa depan."},{"nama":"Periode Khulafaurasyidin","cp":"Memahami proses pemilihan Khulafaurasyidin, substansi dan strategi dakwah Khulafaurasyidin sebagai inspirasi dalam menerapkan asas musyawarah, sikap saling menghargai dan menghormati dalam perbedaan pendapat di kehidupan masa kini dan masa depan."},{"nama":"Periode Klasik/Zaman Keemasan (pada tahun 650 M)","cp":"Memahami proses lahirnya Daulah Umayyah dan Daulah Abbasiyah, perkembangan peradaban dan ilmu pengetahuan pada masa Daulah Umayyah di Damaskus, Daulah Umayyah di Andalusia, dan Daulah Abbasiyah sebagai inspirasi dalam menerapkan semangat jiwa pembelajar untuk menghadapi tantangan era digital dan meneladani semangat tokoh ilmuwan muslim dalam membangun peradaban Islam."}],"F":[{"nama":"Periode Pertengahan/ Zaman Kemunduran (1250 M-1800 M)","cp":"Memahami proses lahirnya Daulah Utsmani, Mughal, dan Syafawi, perkembangan peradaban dan ilmu pengetahuan pada masa Daulah Utsmani, Mughal, dan Syafawi sebagai inspirasi dalam menciptakan kehidupan yang harmonis, toleran, dan moderat dalam kehidupan berbangsa dan bernegara."},{"nama":"Periode Modern/Zaman Kebangkitan (1800 M-sekarang)","cp":"Memahami peran umat Islam pada masa penjajahan, kemerdekaan, dan pascakemerdekaan sebagai inspirasi menjadi muslim yang berwawasan global serta adaptif dalam menghadapi masa kini dan masa yang akan datang."},{"nama":"Periode Islam di Nusantara","cp":"Memahami jalur dan proses awal masuknya Islam di Nusantara, sejarah dan peran kerajaan-kerajaan Islam terhadap perkembangan Islam di Nusantara, dan peran Wali Sanga dalam mengembangkan dakwah Islam di Nusantara sebagai inspirasi menjadi muslim moderat pada zamannya."}]},"tujuan":"1. Membangun kesadaran peserta didik tentang pentingnya mempelajari landasan ajaran, nilai-nilai, dan norma-norma Islam yang telah dibangun oleh Rasulullah Saw. dalam rangka mengembangkan kebudayaan dan peradaban Islam. 2. Membangun kesadaran peserta didik tentang pentingnya waktu dan tempat yang merupakan sebuah proses dari masa lampau, masa kini, dan masa depan. 3. Melatih daya kritis peserta didik untuk memahami fakta sejarah secara benar dengan didasarkan pada pendekatan ilmiah. 4. Menumbuhkan apresiasi dan penghargaan peserta didik terhadap peninggalan sejarah Islam sebagai bukti peradaban umat Islam di masa lampau. 5. Mengembangkan kemampuan peserta didik dalam mengambil ibrah dari peristiwa-peristiwa bersejarah dalam Islam, meneladani tokoh-tokoh berprestasi, dan mengaitkannya dengan fenomena sosial, budaya, politik, ekonomi, IPTEK, seni, dan lain-lain untuk mengembangkan kebudayaan dan peradaban Islam."},"ba":{"judul":"Bahasa Arab (MA)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Menyimak – Berbicara","cp":"Memahami informasi yang diterima secara tersirat dan tersurat serta berinteraksi tentang tema perkenalan, keluarga, madrasah, hobi, profesi, dan kehidupan sehari-hari dengan menggunakan susunan gramatikal: المفرد والمثنى والجمع، المذكر والمؤنث، أدوات الاستفهام، الضمائر، حروف الجر وحروف العطف، الجملة الاسمية والجملة الفعلية، أقسام الفعل، تقسيم الكلمة، الظرف، العدد والمعدود، والأرقام."},{"nama":"Membaca – Memirsa","cp":"Memahami informasi secara tersurat dan tersirat dalam teks visual atau teks multimodal secara interaktif tentang perkenalan, keluarga, madrasah, hobi, profesi, dan kehidupan sehari-hari dengan menggunakan susunan gramatikal: المفرد والمثنى والجمع، المذكر والمؤنث، أدوات الاستفهام، الضمائر، حروف الجر وحروف العطف، الجملة الاسمية والجملة الفعلية، أقسام الفعل، تقسيم الكلمة، الظرف، العدد والمعدود، والأرقام."},{"nama":"Menulis – Mempresentasikan","cp":"Mengomunikasikan ide secara tertulis dan lisan ke dalam wacana terbatas secara logis tentang perkenalan, keluarga, madrasah, hobi, profesi, dan kehidupan sehari-hari dengan menggunakan susunan gramatikal: المفرد والمثنى والجمع، المذكر والمؤنث، أدوات الاستفهام، الضمائر، حروف الجر وحروف العطف، الجملة الاسمية والجملة الفعلية، أقسام الفعل، تقسيم الكلمة، الظرف، العدد والمعدود، والأرقام."}],"F":[{"nama":"Menyimak - Berbicara","cp":"Memahami informasi yang diterima secara tersirat dan tersurat dan mengonstruksi bahasa secara lisan tentang wisata, kesehatan, haji dan umrah, agama-agama di Indonesia, teknologi informasi dan komunikasi, tokoh-tokoh Islam, serta kuliah di universitas dengan menggunakan struktur gramatikal: الفعل المبني للمعلوم والمبني للمجهول، الفعل المضارع المرفوع والمنصوب والمجزوم، النعت، الإضافة، اسم التفضيل، التصريف اللغوي للفعل الماضي، التصريف اللغوي لفعل الأمر، والتصريف اللغوي للفعل المضارع."},{"nama":"Membaca – Memirsa","cp":"Memahami secara tersurat dan tersirat berbagai teks visual atau teks multimodal dalam cerita pendek/artikel/esai/laporan/buku tentang wisata, kesehatan, haji dan umrah, agama-agama di Indonesia, teknologi informasi dan komunikasi, tokoh-tokoh Islam, serta kuliah di universitas dengan menggunakan struktur gramatikal: الفعل المبني للمعلوم والمبني للمجهول، الفعل المضارع المرفوع والمنصوب والمجزوم، النعت، الإضافة، اسم التفضيل، والتصريف اللغوي للفعل الماضي والمضارع والأمر."},{"nama":"Menulis – Mempresentasikan","cp":"Memahami gagasan teks secara tertulis dan lisan dengan bebas sesuai tema wisata, kesehatan, haji dan umrah, agama-agama di Indonesia, teknologi informasi dan komunikasi, tokoh-tokoh Islam, serta kuliah di universitas dengan menggunakan struktur gramatikal: الفعل المبني للمعلوم والمبني للمجهول، الفعل المضارع المرفوع والمنصوب والمجزوم، النعت، الإضافة، اسم التفضيل، والتصريف اللغوي للفعل الماضي والمضارع والأمر."}]},"tujuan":"Pembelajaran bahasa Arab di madrasah mempunyai tujuan untuk mempersiapkan peserta didik memiliki kemampuan menggunakan bahasa Arab sebagai alat komunikasi global dan alat untuk mendalami agama dari sumber autentik yang pada umumnya menggunakan bahasa Arab dan melalui proses rantai keilmuan (isnad) yang terus bersambung hingga sumber asalnya yaitu Al-Qur’an dan Hadis."},"ba_mapk":{"judul":"Bahasa Arab Program Keagamaan (Sharf, Nahwu, Balaghah)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Sharf","cp":"Memahami bentuk, makna, dan fungsi: تقسيم الكلمة، الضمير، المذكر والمؤنث، المفرد والمثنى والجمع، الفعل الماضي والمضارع وفعل الأمر، التصريف اللغوي للفعل الماضي والمضارع وفعل الأمر، الفعل الصحيح والمعتل، الفعل اللازم والمتعدي، الفعل المجرد والمزيد وفوائد الزيادة، اسم الفاعل، اسم المفعول، والمعرب والمبني."}],"F":[{"nama":"Nahwu","cp":"Memahami bentuk, makna, dan fungsi: مرفوعات الأسماء (المبتدأ والخبر، الفاعل، نائب الفاعل، اسم كان وأخواتها، خبر إن وأخواتها، التوابع للمرفوع)، منصوبات الأسماء (المفعول به، المفعول المطلق، المفعول لأجله، المفعول فيه، المفعول معه، المستثنى، الحال، التمييز، المنادى، التوابع للمنصوب)، مجرورات الأسماء (مجرور بالحرف، مجرور بالإضافة، التابع للمجرور)، إعراب الفعل المضارع، الصفة المشبهة، اسم المبالغة، واسم التفضيل."},{"nama":"Balaghah: Ilmu Ma‘ani","cp":"Memahami bentuk, makna, dan fungsi fasahah dan balaghah, serta ilmu al-ma‘ani: الخبر وأنواعه، الإنشاء وأنواعه، والقصر وأنواعه."},{"nama":"Balaghah: Ilmu Bayan","cp":"Memahami bentuk, makna, dan fungsi ilmu al-bayan: التشبيه وأنواعه، المجاز وأنواعه (المرسل، العقلي)، الاستعارة (التصريحية، المكنية)، والكناية وأنواعها."},{"nama":"Balaghah: Ilmu Badi‘","cp":"Memahami bentuk, makna, dan fungsi ilmu al-badi‘: المحسنات اللفظية (الجناس وأنواعه، السجع، الاقتباس) والمحسنات المعنوية (التورية، الطباق، المقابلة، تأكيد المدح بما يشبه الذم، تأكيد الذم بما يشبه المد
