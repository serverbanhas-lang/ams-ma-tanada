body{background:radial-gradient(ellipse at 90% 0%,rgba(199,164,91,.09),transparent 34%),var(--canvas);color:var(--ink)}
#app{grid-template-columns:286px minmax(0,1fr)}
#nav{background:linear-gradient(165deg,#0b3c32 0%,#082f28 56%,#062720 100%);box-shadow:5px 0 24px rgba(10,42,33,.08);border-right:1px solid rgba(199,164,91,.24)}
.brand{padding:25px 21px 20px;border-bottom:1px solid rgba(214,190,126,.24);background:linear-gradient(135deg,rgba(255,255,255,.045),transparent)}
.brand b{font-family:var(--doc);font-size:20px;letter-spacing:.15px;line-height:1.25;color:#fff8e8}
.brand span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#d5b970;margin-top:7px}
.nav-g{padding:17px 13px 5px}.nav-g h3{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#d2b66e;margin:0 9px 9px}
.nav-a{padding:9px 11px;margin:3px 0;border-radius:8px;border-left:3px solid transparent;color:#e0eee7;font-size:12.5px;transition:background .18s,border-color .18s}
.nav-a:hover{background:rgba(255,255,255,.08);color:#fff}.nav-a.on{background:linear-gradient(90deg,rgba(213,185,112,.2),rgba(255,255,255,.07));border-left-color:#d8bb70;color:#fff9e9;box-shadow:inset 0 0 0 1px rgba(213,185,112,.08)}
#nav-foot{color:#b7cdbf;border-top:1px solid rgba(255,255,255,.09);line-height:1.6}
main{background:transparent}#topbar{padding:13px 24px;min-height:68px;background:rgba(255,253,247,.96);border-bottom:1px solid #e0e5d9;box-shadow:0 5px 22px rgba(25,49,38,.035);backdrop-filter:blur(10px)}
#topbar h1{font-family:var(--doc);font-size:23px;font-weight:700;color:var(--brand-dark);letter-spacing:.1px}
#stage{padding:27px 28px 70px}#content{max-width:100%}
.btn{border-color:#d6dfd6;border-radius:8px;background:#fffdf8;box-shadow:0 1px 2px rgba(17,48,35,.035);transition:all .18s ease;padding:8px 13px}
.btn:hover{background:#f7f7ee;border-color:#b9c9b8;transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#176d58,#0c4a3c);border-color:#0c5947;color:#fffdf3;box-shadow:0 4px 10px rgba(12,74,60,.15)}.btn.primary:hover{background:linear-gradient(135deg,#1b7962,#0d5544)}
.btn.danger{background:#fffaf8}.mini-select,.in,.panel textarea,.panel select{border-color:#d5dfd5;border-radius:8px;background:#fffdf8}
.panel,details.item{border:1px solid #e0e5d9;border-radius:13px;background:rgba(255,253,247,.97);box-shadow:0 5px 18px rgba(31,54,39,.045);}
.panel{padding:20px 22px;margin-bottom:18px}.panel h2{font-family:var(--doc);font-size:20px;color:var(--brand-dark);padding-bottom:9px;border-bottom:1px solid #e9e4d4;margin-bottom:14px}.panel p.hint{line-height:1.7}
.tabs{border-bottom:1px solid #d9e2d9;gap:5px}.tab{padding:10px 15px;border-radius:8px 8px 0 0}.tab.on{color:var(--brand-dark);border-bottom-color:var(--gold);background:rgba(199,164,91,.09)}
.home-head{border-bottom:2px solid var(--gold);padding:12px 4px 22px;position:relative}.home-head:after{content:"۞";position:absolute;right:7px;top:0;color:rgba(199,164,91,.4);font-size:38px}.home-head .school{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#a17b31}.home-head h2{font-size:clamp(30px,3vw,43px);color:var(--brand-dark);letter-spacing:-.5px;margin:7px 0 14px}.home-head dl{gap:32px}.home-head dt{letter-spacing:.4px}.home-head dd{color:#263e34}
.stats{gap:14px;margin-bottom:25px}.stats div{background:#fffdf7;border:1px solid #e1e5d8;border-radius:11px;padding:13px 18px;min-width:135px;box-shadow:0 3px 12px rgba(31,54,39,.035)}.stats div b{font-size:25px;color:var(--brand-dark)}.stats div span{letter-spacing:.2px}
.toc{gap:20px}.toc>div{background:rgba(255,253,247,.78);border:1px solid #e0e5d9;border-radius:12px;padding:15px 17px;box-shadow:0 4px 14px rgba(31,54,39,.035)}.toc h3{color:var(--brand-dark);border-bottom-color:#d9c99e;padding-bottom:10px}.toc-i{padding:10px 7px;border-bottom-color:#edf0e8}.toc-i:hover{background:#f4f7ef}.toc-c{color:#a27c31}
.badge{background:#e2f0e8;color:#0b5745;border:1px solid #cfe4d8}.badge.hots{background:#f7efd9;color:#805d1d;border:1px solid #ead8a8}
.empty{border-color:#c7d8cb;background:#fbfcf5;border-radius:12px;padding:34px}.paper{box-shadow:0 4px 10px rgba(18,39,27,.10),0 18px 45px rgba(18,39,27,.07)}
.addrow{border-color:#c7d8cb;background:#f7faf3;border-radius:8px}.addrow:hover{background:#e8f2e9}.ed:hover{background:#f8f5e9;box-shadow:inset 0 -1px 0 #c7a45b}.ed:focus{background:#eef6ef;box-shadow:inset 0 0 0 1px var(--brand)}
#modal{background:rgba(4,35,28,.68);backdrop-filter:blur(4px)}#modal .box{border:1px solid rgba(199,164,91,.4);border-radius:15px;box-shadow:0 20px 65px rgba(0,0,0,.22)}#modal h2{font-size:27px}.choice{border-radius:10px}.choice:hover{background:#f5f8ef;border-color:var(--gold)}
#toast{background:#092f27;border:1px solid rgba(199,164,91,.45);box-shadow:0 6px 22px rgba(0,0,0,.18);border-radius:10px}
.kredit{left:286px;color:#87968b}
@media(max-width:980px){#app{grid-template-columns:1fr}#stage{padding:16px 10px 60px}#topbar{padding:10px 12px;gap:7px}#topbar h1{font-size:20px}.panel{padding:15px}.home-head h2{font-size:30px}.stats div{flex:1;min-width:110px}.kredit{left:8px}}
@media(prefers-reduced-motion:reduce){.btn,.nav-a{transition:none}}
@media print{body{background:#fff}#topbar h1{font-size:17px}.paper{box-shadow:none}}
</style>


<style id="welcome-screen-premium">
#welcome-screen-ma-tanada{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px;background:radial-gradient(ellipse at 50% 35%,rgba(24,112,83,.82),transparent 48%),linear-gradient(135deg,#041e19 0%,#073d31 48%,#041c18 100%);color:#fff;text-align:center;isolation:isolate}
#welcome-screen-ma-tanada::before,#welcome-screen-ma-tanada::after{content:"";position:absolute;inset:18px;border:1px solid rgba(226,190,103,.42);border-radius:24px;pointer-events:none}
#welcome-screen-ma-tanada::after{inset:28px;border-color:rgba(255,255,255,.09);border-radius:18px}
.welcome-glow{position:absolute;width:min(75vw,700px);aspect-ratio:1;border-radius:50%;background:rgba(218,174,76,.1);filter:blur(70px);z-index:-1;animation:welcomePulse 5s ease-in-out infinite alternate}

.welcome-eyebrow{font-size:clamp(12px,1.6vw,17px);font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#d8e8df;margin:0 0 16px;animation:welcomeFade 1.5s .15s both}
.welcome-title{margin:0 auto;color:#f3d58a;font-family:var(--doc,Georgia,serif);font-size:clamp(38px,8vw,94px);line-height:1.08;font-weight:700;letter-spacing:.015em;text-wrap:balance;text-shadow:0 3px 0 #8e6925,0 8px 30px rgba(0,0,0,.35);background:linear-gradient(100deg,#fff4cb 5%,#e6c16a 28%,#fff2c2 48%,#c99535 68%,#fff0bd 90%);background-size:220% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:welcomeShimmer 5s linear infinite,welcomeTitleIn 1.25s .1s both}

.welcome-motto{margin:0;color:#fff;font-size:clamp(21px,4.2vw,43px);line-height:1.35;font-weight:800;letter-spacing:.045em;text-shadow:0 3px 18px rgba(0,0,0,.35);animation:welcomeMotto 1.1s .5s both}

@keyframes welcomePulse{from{transform:scale(.88);opacity:.55}to{transform:scale(1.12);opacity:1}}
@keyframes welcomeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes welcomeRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes welcomeFade{from{opacity:0}to{opacity:1}}
@keyframes welcomeTitleIn{from{opacity:0;letter-spacing:.12em;transform:scale(.94)}to{opacity:1;letter-spacing:.015em;transform:scale(1)}}
@keyframes welcomeShimmer{to{background-position:220% center}}
@keyframes welcomeMotto{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes welcomeOut{to{opacity:0;visibility:hidden;transform:scale(1.025)}}
@media(max-width:520px){#welcome-screen-ma-tanada::before{inset:10px;border-radius:17px}#welcome-screen-ma-tanada::after{inset:17px;border-radius:12px}.welcome-ornament{margin-bottom:14px}.welcome-divider{margin:22px auto 16px}#welcome-enter{margin-top:28px;width:min(100%,260px)}}
@media(prefers-reduced-motion:reduce){#welcome-screen-ma-tanada *,#welcome-screen-ma-tanada::before,#welcome-screen-ma-tanada::after{animation:none!important;transition:none!important}.welcome-title{background-position:center}}
@media print{#welcome-screen-ma-tanada{display:none!important}}
</style>

<body>
<section id="welcome-screen-ma-tanada" role="dialog" aria-modal="true" aria-labelledby="welcome-title-ma-tanada">

  <div class="welcome-content">
    <div class="welcome-ornament" aria-hidden="true">۞ ✦ ۞</div>

    <h1 class="welcome-title" id="welcome-title-ma-tanada">MA TANADA</h1>
    <div class="welcome-divider" aria-hidden="true">✧</div>
    <p class="welcome-motto"><span>Luhur Budi</span><br>Unggul Prestasi</p>
    <p class="welcome-subtitle">Berilmu • Berakhlak • Menginspirasi</p>
    <button id="welcome-enter" type="button">Masuk ke Menu Utama&nbsp; <span aria-hidden="true">➜</span></button>

</section>

<div id="app">
  <aside id="nav" aria-label="Menu utama"></aside>
  <main>
    <header id="topbar">
      <button class="btn sm" id="navToggle" type="button">Menu</button>

      <span id="tools" class="row"></span>
      <select id="zoom" class="mini-select" title="Perbesar atau perkecil tampilan" aria-label="Zoom tampilan">
        <option value="0.6">60%</option><option value="0.75">75%</option><option value="0.9">90%</option>
        <option value="1" selected>100%</option><option value="1.15">115%</option><option value="1.3">130%</option>

        <option value="A4">Kertas A4</option><option value="F4">Kertas F4</option>
      </select>
      <button class="btn" id="btnSimpan" type="button" title="Simpan semua data ke berkas di komputer">Simpan</button><button class="btn sm" id="btnBuka" type="button" title="Buka berkas data yang pernah disimpan">Buka data</button><input type="file" id="fileBuka" accept=".json,application/json" hidden>
      <button class="btn primary" id="btnPrint" type="button">Cetak / simpan PDF</button>

</script>

asar bagaimana memecahkan masalah terkait :","Peserta didik mendengarkan dengan seksama penyampaian topik dan berupaya menjawab pertanyaan guru. (Communication, Critical Thinking, Creativity)"],["Mendesain Perencanaan Produk","Guru memastikan setiap peserta didik dalam kelompok memilih dan mengetahui prosedur pembuatan proyek/produk yang akan dibuat.","Peserta didik berdiskusi menyusun rencana pembuatan proyek pemecahan masalah meliputi pembagian tugas, persiapan alat, bahan, media, dan sumber yang dibutuhkan. (Collaboration, Communication, Critical Thinking)"],["Menyusun Jadwal Pembuatan","Guru dan peserta didik membuat kesepakatan tentang jadwal pembuatan proyek (tahapan-tahapan dan pengumpulan).","Peserta didik menyusun jadwal penyelesaian proyek dengan memperhatikan batas waktu yang telah ditentukan bersama. (Communication, Collaboration, Creativity)"],["Memonitor Keaktifan dan Perkembangan Proyek","Guru memantau keaktifan peserta didik selama melaksanakan proyek, memantau realisasi perkembangan dan membimbing jika mengalami kesulitan.","Peserta didik melakukan pembuatan proyek sesuai jadwal, mencatat setiap tahapan, mendiskusikan masalah yang muncul selama penyelesaian proyek dengan guru. (Creativity, Collaboration, Communication, Critical Thinking). (Diferensiasi Produk)"],["Menguji Hasil","Guru berdiskusi tentang prototipe proyek, memantau keterlibatan peserta didik, dan mengukur ketercapaian standar.","Peserta didik membahas kelayakan proyek yang telah dibuat dan membuat laporan produk/karya untuk dipaparkan kepada orang lain. (Collaboration, Communication, Creativity, Critical Thinking)"],["Evaluasi Pengalaman Belajar","Guru membimbing proses pemaparan proyek, menanggapi hasil, selanjutnya guru dan peserta didik merefleksi/menyimpulkan.","Peserta didik/kelompok memaparkan laporan, sedangkan yang lain memberikan tanggapan, dan bersama guru menyimpulkan hasil proyek."]],"Problem Based Learning (PBL)":[["Orientasi Peserta Didik pada Masalah","Guru menyajikan m engajar guru):\n${jpBlock()}\n\nKalender umum yang berkaitan (hari besar nasional dan kegiatan umum, sudah dianalisis terhadap kalender pendidikan dan jadwal):\n${kalenderUmumBlok(30)}\n${e?"\nArahan tambahan dari guru:\n"+e+"\n":""}\nSusun secara berurutan:\n1. Tujuan Pembelajaran (TP): turunkan dari CP setiap elemen, sekitar 2 sampai 5 TP per elemen. Setiap TP satu kalimat yang memuat KOMPETENSI (kata kerja operasional) dan KONTEN (lingkup materi berupa pengetahuan esensial dan aplikatif). Pilih kata kerja menurut taksonomi SOLO dan dorong eksplorasi konsep, bukan hafalan: uni-struktural (mengidentifikasi, menyebutkan, menghitung), multi-struktural (menjelaskan, mengklasifikasikan, menguraikan), relasional (menerapkan, menganalisis, membandingkan), abstrak meluas (merancang, menyusun, merefleksikan). Urutkan TP dari tingkat rendah ke tinggi. Tulis nama elemen persis seperti di atas.\n2. KKTP: 2 sampai 4 kriteria ketercapaian per TP berupa indikator yang dapat diamati dan diukur, bertahap dari memahami, mengaplikasi, hingga merefleksi (level SOLO makin tinggi). KKTP ini juga menjadi dasar indikator soal.\n3. Asesmen per TP, selaras dengan TP dan pengalaman belajar: asesmen awal (diagnostik: kesiapan dan pengetahuan awal), asesmen proses (formatif: observasi, kuis, refleksi, umpan balik), dan asesmen akhir (sumatif: tes, proyek, produk, presentasi). Untuk madrasah boleh memuat asesmen kinerja atau praktik (mis. praktik ibadah, tilawah, hafalan, muhadatsah), proyek, portofolio, dan pengamatan sikap cinta (Panca Cinta). Tulis dengan awalan "Diagnostik:", "Formatif:", dan "Sumatif:" yang dipisah titik koma.\n4. Alur Tujuan Pembelajaran (ATP): urutkan TP secara logis, lalu bagi menjadi pertemuan. Tentukan semester (smt 1 atau 2) tiap pertemuan. Jumlah JP semua pertemuan pada semester 1 HARUS sama persis dengan JP MATERI semester 1, dan begitu pula semester 2. Satu pertemuan umumnya 2 sampai 6 JP dan menyesuaikan jadwal mengajar.\nPertimbangkan peristiwa pada kalender um an manfaat menghindari penyakit hati."},{"nama":"Fikih","cp":"Menerapkan dan merefleksikan sumber hukum Islam, pentingnya menjaga lima prinsip dasar hukum Islam (al-kulliyāt al-khamsah), ekonomi syariah, dan wakaf."},{"nama":"Sejarah Peradaban Islam","cp":"Merefleksikan peran tokoh ulama dalam penyebaran Islam di Indonesia."}],"F":[{"nama":"Al-Qur’an Hadis","cp":"Membaca, menghafal, menulis, dan merefleksikan ayat Al-Qur’an tentang pentingnya berpikir kritis, ilmu pengetahuan dan teknologi, memelihara kehidupan manusia, dan moderasi beragama beserta hadis terkait."},{"nama":"Akidah","cp":"Meyakini dan merefleksikan beberapa cabang iman (syu‘ab al-īmān), keterkaitan antara iman, Islam, dan ihsan."},{"nama":"Akhlak","cp":"Menerapkan manfaat menghindari penyakit sosial; merefleksikan adab bermasyarakat dan etika digital dalam Islam."},{"nama":"Fikih","cp":"Menerapkan dan merefleksikan ketentuan khotbah, tablig dan dakwah, ekonomi syariah, wakaf, munakahat, dan mawaris."},{"nama":"Sejarah Peradaban Islam","cp":"Merefleksikan peran tokoh ulama Indonesia dalam perkembangan peradaban Islam di dunia dan peran organisasi-organisasi Islam di Indonesia."}]},"tujuan":"Mata pelajaran Pendidikan Agama Islam dan Budi Pekerti bertujuan untuk membimbing murid agar: 1. beriman, bertakwa kepada Allah Swt., dan berakhlak mulia; 2. menjadi pribadi yang memahami dengan baik prinsip-prinsip agama Islam terkait akidah berdasar ahl al-sunnah wa al-jamā‘ah, syariat, akhlak mulia, dan perkembangan sejarah peradaban Islam; 3. mampu menerapkan prinsip-prinsip Islam dalam berpikir sehingga dapat menyimpulkan sesuatu dan mengambil keputusan dengan benar, tepat, dan arif; 4. mampu bernalar kritis dalam menganalisis perbedaan pendapat sehingga berperilaku moderat (wasaṭiyyah); 5. menyayangi lingkungan alam dan menumbuhkan rasa tanggung jawab sebagai khalifah di muka bumi; dan 6. menjunjung tinggi nilai persatuan dan kesatuan sehingga dapat menguatkan persaudaraan kemanusiaan (ukhuwwah basyariyyah), persaudaraan seagama (ukhuwwah Islāmiyyah), dan persaudaraan setanah air (ukhuwwah waṭaniyyah).","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025 sebagaimana diubah dengan Keputusan Kepala BSKAP Nomor 020 Tahun 2026"},"pancasila":{"judul":"Pendidikan Pancasila","hal":76,"fase":{"E":[{"nama":"Pancasila","cp":"Menganalisis cara pandang para perumus Pancasila tentang dasar negara; menganalisis kedudukan Pancasila sebagai dasar negara, pandangan hidup bangsa, dan ideologi negara."},{"nama":"Undang-Undang Dasar Negara Republik Indonesia Tahun 1945","cp":"Menerapkan perilaku taat hukum berdasarkan peraturan yang berlaku untuk mewujudkan harmoni dengan sesama manusia dan lingkungan; menganalisis tata urutan peraturan perundang - undangan di Indonesia; menganalisis makna kedudukan Pancasila sebagai sumber dari segala sumber hukum negara."},{"nama":"Bhinneka Tunggal Ika","cp":"Menyajikan makna semboyan Bhinneka Tunggal Ika sebagai modal sosial; dan memahami prinsip gotong royong sebagai perwujudan sistem ekonomi Pancasila yang inklusif dan berkeadilan."},{"nama":"Negara Kesatuan Republik Indonesia","cp":"Memahami peran dan kedudukannya sebagai warga Negara Indonesia; memahami sistem pertahanan dan keamanan negara; menganalisis peran Indonesia dalam hubungan antarnegara; serta memahami nilai-nilai Pancasila dalam konteks pembangunan nasional."}],"F":[{"nama":"Pancasila","cp":"Mendeskripsikan rumusan dan keterkaitan sila-sila dalam Pancasila; menganalisis peluang dan tantangan penerapan nilai-nilai Pancasila dalam kehidupan global dalam konteks Pancasila sebagai ideologi negara dan membiasakan perilaku yang sesuai dengan nilai-nilai Pancasila sebagai identitas nasional dalam kehidupan sehari-hari."},{"nama":"Undang-Undang Dasar Negara Republik Indonesia Tahun 1945","cp":"Menganalisis dinamika pemberlakuan Undang-Undang Dasar 1945; menunjukkan sikap demokratis berdasarkan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dalam era keterbukaan informasi; menganalisis kasus pelanggaran hak dan pengingkaran kewajiban warga negara dan merumuskan solusi dari permasalahan tersebut sebagai upaya perlindungan hukum; menganalisis makna kesatuan Pancasila dengan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945."},{"nama":"Bhinneka Tunggal Ika","cp":"Menganalisis potensi konflik dan memberi solusi yang berkeadilan terhadap permasalahan keberagaman di masyarakat; merancang kegiatan bersama dengan prinsip gotong royong dalam praktik hidup sehari-hari."},{"nama":"Negara Kesatuan Republik Indonesia","cp":"Mendemonstrasikan praktik demokrasi berlandaskan Pancasila dalam kehidupan berbangsa dan bernegara; menganalisis dan merumuskan solusi terkait ancaman, tantangan, hambatan, dan gangguan (ATHG) yang dihadapi Indonesia; menganalisis sistem pemerintahan Indonesia, dan peran lembaga-lembaga negara dalam bidang politik, ekonomi, sosial, budaya, pertahanan dan keamanan."}]},"tujuan":"Mata pelajaran Pendidikan Pancasila bertujuan untuk membentuk murid yang 1. berakhlak mulia dengan didasari keimanan dan ketakwaan kepada Tuhan Yang Maha Esa melalui sikap mencintai sesama manusia, lingkungan, dan negara untuk mewujudkan persatuan, demokrasi, dan keadilan sosial dengan menanamkan penyadaran, keteladanan, dan pembiasaan; 2. memahami makna dan nilai-nilai Pancasila sebagai dasar negara, pandangan hidup, dan ideologi negara, serta mempraktikkan nilai-nilai Pancasila dalam kehidupan bermasyarakat, berbangsa, dan bernegara; 3. mematuhi konstitusi dan norma yang berlaku serta menyelaraskan perwujudan hak dan kewajibannya dalam kehidupan bermasyarakat, berbangsa, dan bernegara di masyarakat global; 4. memahami jati diri sebagai bagian dari bangsa Indonesia yang berbhineka dan berupaya untuk mewujudkan persatuan dan kesatuan dalam bingkai Bhinneka Tunggal Ika, serta bersikap adil dan menghargai perbedaan SARA, status sosial-ekonomi, jenis kelamin dan penyandang disabilitas; dan 5. mempertahankan keutuhan Negara Kesatuan Republik Indonesia dan berperan aktif dalam menciptakan perdamaian dunia.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"bindo":{"judul":"Bahasa Indonesia","hal":88,"fase":{"E":[{"nama":"Menyimak","cp":"Mengevaluasi gagasan, pandangan, arahan, dan/atau pesan dari teks nonsastra berbentuk teks aural (teks yang dibacakan dan/atau didengarkan); dan mengevaluasi unsur intrinsik dan ekstrinsik teks sastra berbentuk teks aural."},{"nama":"Membaca dan Memirsa Mengevaluasi informasi berupa gagasan,","cp":"pandangan, arahan, dan/atau pesan dari berbagai tipe teks berwujud visual dan/atau audiovisual untuk menemukan makna yang tersurat dan tersirat; menginterpretasi informasi untuk mengungkapkan gagasan dan perasaan (simpati, peduli, dan empati) dari berbagai tipe teks berwujud teks visual dan/atau audiovisual secara kreatif; mengevaluasi kualitas dan/atau kredibilitas dari berbagai tipe teks berwujud teks visual dan/atau audiovisual menggunakan sumber informasi lain; dan membandingkan isi teks."},{"nama":"Berbicara dan Mempresentasikan","cp":"Mempresentasikan gagasan, pandangan, arahan, dan/atau pesan berbagai tipe teks berbentuk monolog, dialog, dan/atau gelar wicara secara sistematis, kritis, dan/atau kreatif; dan mengungkapkan kepedulian dari berbagai tipe teks dan/atau teks multimodal secara kreatif."},{"nama":"Menulis","cp":"Menulis gagasan, pandangan, arahan, pesan, dan/atau imajinasi dalam berbagai tipe teks secara logis, kritis, dan kreatif; dan memublikasikan hasil karya di media cetak, elektronik, dan/atau digital."}],"F":[{"nama":"Menyimak","cp":"Mengevaluasi gagasan, perasaan, pandangan, arahan, dan/atau pesan dari teks nonsastra berbentuk teks aural (teks yang dibacakan dan/atau didengarkan); dan mengapresiasi teks sastra berbentuk teks aural."},{"nama":"Membaca dan Memirsa Mengevaluasi informasi berupa gagasan,","cp":"perasaan, pandangan, arahan, dan/atau pesan dari berbagai tipe teks berwujud teks visual dan/atau audiovisual untuk menemukan makna yang tersurat dan tersirat berdasarkan kaidah logika berpikir; merefleksi gagasan dan pandangan berdasarkan kaidah logika berpikir dari berbagai tipe teks berwujud teks visual dan/atau audiovisual; dan mengapresiasi berbagai tipe teks berwujud teks visual dan/atau audiovisual."},{"nama":"Berbicara dan Mempresentasikan","cp":"Mempresentasikan gagasan, perasaan, pandangan, arahan, pesan, dan/atau kreativitas berbahasa dalam berbagai tipe teks berbentuk monolog, dialog, dan/atau gelar wicara dan/atau berbagai tipe teks secara logis, sistematis, kritis, dan kreatif sesuai dengan norma kesopanan dan budaya Indonesia; menyajikan karya sastra secara kreatif dan menarik; dan mempertahankan hasil penelitian dengan argumentasi."},{"nama":"Menulis","cp":"Menulis gagasan, pandangan, imajinasi, dan/atau pengetahuan metakognisi dalam berbagai tipe teks secara logis, kritis, dan kreatif; dan mempublikasikan hasil karya di media cetak, elektronik, dan/atau digital."}]},"tujuan":"Mata pelajaran Bahasa Indonesia bertujuan untuk mengembangkan: 1. kemampuan berkomunikasi secara efektif dan santun; 2. sikap pengutamaan dan penghargaan terhadap bahasa Indonesia sebagai bahasa resmi negara Republik Indonesia; 3. kemampuan berbahasa dengan berbagai teks multimodal (lisan, tulis, visual, audio dan audiovisual) untuk berbagai tujuan dan konteks; 4. kemampuan literasi (berbahasa, bersastra, dan bernalar) dalam belajar dan bekerja; 5. kepercayaan diri untuk berekspresi sebagai individu yang cakap, sehat mental dan fisik, mandiri, bergotong-royong, serta bertanggung jawab; 6. pemahaman tentang kaidah tata bahasa, kosakata, sastra, dan budaya Indonesia; 7. kepedulian terhadap budaya lokal dan lingkungan sekitarnya; dan 8. kepedulian untuk berkontribusi sebagai warga Indonesia.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"mtk":{"judul":"Matematika","hal":106,"fase":{"E":[{"nama":"Bilangan","cp":"Menggeneralisasi sifat-sifat bilangan berpangkat (termasuk bilangan pangkat pecahan), dan menggunakannya untuk menyelesaikan masalah."},{"nama":"Aljabar dan Fungsi","cp":"Menyelesaikan masalah yang berkaitan dengan sistem pertidaksamaan linear dua variabel; menyelesaikan masalah yang berkaitan dengan persamaan dan fungsi kuadrat (termasuk akar imajiner), serta persamaan eksponensial (berbasis/ bilangan pokok sama) dan fungsi eksponensial."},{"nama":"Geometri","cp":"Mengaplikasikan perbandingan trigonometri (sinus, cosinus, tangen) dari sudut lancip."},{"nama":"Analisis Data dan Peluang","cp":"Merepresentasikan dan menginterpretasi data dengan cara menentukan jangkauan kuartil dan interkuartil; membuat dan menginterpretasi diagram box plot dan menggunakannya untuk membandingkan himpunan data; menentukan dan menggunakan dari box plot, histogram dan dot plot sesuai dengan natur (karakteristik) data dan kebutuhan; menggunakan diagram pencar untuk menyelidiki dan menjelaskan hubungan antara dua variabel numerik/kuantitatif (termasuk salah satunya variabel bebas berupa waktu); serta mengevaluasi laporan statistika di media berdasarkan tampilan, statistika dan representasi data, termasuk yang disajikan dalam bentuk matriks."}],"F":[{"nama":"Bilangan","cp":"Menjelaskan barisan dan deret (aritmetika dan geometri), menerapkannya pada beragam masalah terutama masalah bunga tunggal dan majemuk, memodelkan pinjaman dan investasi dengan bunga majemuk dan anuitas, serta menyelidiki (secara numerik atau grafis) pengaruh masing-masing parameter (suku bunga, periode pembayaran) dalam model tersebut."},{"nama":"Aljabar dan Fungsi","cp":"Menentukan fungsi invers, komposisi fungsi, dan transformasi fungsi untuk memodelkan situasi dunia nyata menggunakan fungsi yang sesuai (linear, kuadrat, eksponensial)."},{"nama":"Geometri","cp":"Menerapkan, mengidentifikasi dan menjelaskan hubungan antara unsur-unsur lingkaran untuk menyelesaikan masalah."},{"nama":"Analisis Data dan Peluang","cp":"Melakukan proses penyelidikan statistika untuk mengidentifikasi dan menjelaskan asosiasi antara dua variabel kategorikal (kualitatif) dan antara dua variabel numerikal (kuantitatif); memperkirakan model linear terbaik (best fit linear) pada data numerikal (kuantitatif); membedakan hubungan asosiasi dan sebab-akibat; menjelaskan peluang dan menentukan frekuensi harapan dari kejadian majemuk; menyelidiki konsep dari kejadian saling bebas dan saling lepas, dan menentukan peluangnya; serta memahami konsep peluang bersyarat dan kejadian yang saling bebas menggunakan konsep permutasi dan kombinasi."}]},"tujuan":"Mata pelajaran Matematika bertujuan untuk membekali murid agar dapat: 1. memahami materi pembelajaran matematika berupa fakta, konsep, prinsip, operasi, dan relasi matematis dan mengaplikasikannya secara luwes, akurat, efisien, dan tepat dalam pemecahan masalah matematis (pemahaman matematis dan kecakapan prosedural); 2. menggunakan penalaran pada pola dan sifat, melakukan manipulasi matematis dalam membuat generalisasi, menyusun bukti, atau menjelaskan gagasan dan pernyataan matematika (penalaran dan pembuktian matematis); 3. memecahkan masalah yang meliputi kemampuan memahami masalah, merancang model matematis, menyelesaikan model atau menafsirkan solusi yang diperoleh (pemecahan masalah matematis); 4. mengomunikasikan gagasan dengan simbol, tabel, diagram, atau media lain untuk memperjelas keadaan atau masalah, serta menyajikan suatu situasi ke dalam simbol atau model matematis (komunikasi dan representasi matematis); 5. mengaitkan materi pembelajaran matematika berupa fakta, konsep, prinsip, operasi, dan relasi matematis pada suatu bidang kajian, lintas bidang kajian, lintas bidang ilmu, dan dengan kehidupan (koneksi matematis); dan 6. memiliki sikap menghargai kegunaan matematika dalam kehidupan, yaitu memiliki rasa ingin tahu, perhatian, dan minat dalam mempelajari matematika, serta sikap kreatif, sabar, mandiri, tekun, terbuka, tangguh, ulet, dan percaya diri dalam pemecahan masalah (disposisi matematis).","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"bing":{"judul":"Bahasa Inggris","hal":126,"fase":{"E":[{"nama":"Menyimak - Berbicara (Listening - Speaking)","cp":"Memahami alur informasi secara keseluruhan, gagasan utama dan detail dalam teks lisan fiksi dan non fiksi mengenai berbagai macam topik yang relevan dengan topik sehari-hari atau isu terkini; menggunakan bahasa Inggris untuk mengungkapkan pendapat dan mempertahankan argumen tentang topik yang dibahas. (Understand the entire flow of information, the main idea and details in fiction and nonfiction spoken texts about various topics relevant to everyday topics or current issues; using English to express their opinions and defend their arguments about the topics discussed)"},{"nama":"Membaca - Memirsa (Reading - Viewing)","cp":"Memahami alur informasi secara keseluruhan, menganalisis dan menyimpulkan informasi tersurat dan tersirat dari berbagai jenis teks fiksi dan non fiksi tertulis atau teks multimodal tentang topik sehari-hari atau isu terkini. (Understand the entire flow of information, analyze and infer explicit and implicit information in fiction and nonfiction from written and multimodal texts about everyday topics or current issues)"},{"nama":"Menulis-Mempresentasikan (Writing - Presenting) Mengomunikasikan gagasan dan pengalaman","cp":"mereka secara tertulis atau multimodal dalam berbagai jenis teks fiksi dan nonfiksi dengan menggunakan berbagai media presentasi (cetak atau digital) untuk mencapai tujuan tertentu dengan struktur teks dan unsur kebahasaan yang tepat; mengungkapkan pendapat dan mempertahankan argumen tentang topik sehari-hari atau isu terkini. (Communicate their ideas and experiences in written or multimodal texts in fiction and nonfiction texts using different media of presentation (print and digital) to achieve specific goals with appropriate text structures and language features; express their opinions and defend their arguments about everyday topics or current issues)"}],"F":[{"nama":"Menyimak-Berbicara (Listening-Speaking)","cp":"Memahami alur informasi secara keseluruhan dari teks lisan fiksi dan non fiksi tentang isu terkini atau topik terkait mata pelajaran lain; menggunakan bahasa Inggris untuk mengungkapkan pendapat dan mempertahankan argumen tentang topik yang dibahas. (Understand the entire flow of information in fiction and nonfiction spoken texts about current issues or topics related to other subjects; students use English to express their opinions and defend their arguments about the topics discussed)"},{"nama":"Membaca - Memirsa (Reading - Viewing)","cp":"Mengevaluasi informasi tersurat dan tersirat dari berbagai jenis teks fiksi dan non fiksi tertulis atau teks multimodal tentang isu terkini atau topik yang terkait mata pelajaran lain. (Evaluate explicit and implicit information in fiction and nonfiction from written and multimodal texts about current issues or topics related to other subjects)"},{"nama":"Menulis-Mempresentasikan (Writing-Presenting) Mengomunikasikan gagasan atau pengalaman","cp":"secara tertulis atau multimodal dalam berbagai jenis teks fiksi dan nonfiksi dengan struktur teks dan unsur kebahasaan yang tepat dan kompleks dengan menggunakan berbagai media presentasi (cetak dan digital) untuk mencapai tujuan yang berbeda-beda; menunjukkan strategi koreksi dalam kaidah menulis baik dengan bantuan pendidik maupun mandiri; mengungkapkan pendapat dan mempertahankan argumen tentang isu terkini atau topik yang terkait mata pelajaran lain. (Communicate ideas or experiences in written or multimodal texts in fiction and nonfiction texts with appropriate and complex text structures and language features, using different media of presentation (print and digital) to achieve different purposes; demonstrate correction strategies in writing conventions with the help of a teacher or independently; express their opinions and defend their arguments on current issues or topics related to other subjects)"}]},"tujuan":"Mata pelajaran Bahasa Inggris bertujuan untuk memastikan murid dapat melakukan hal-hal sebagai berikut: 1. mengembangkan kompetensi komunikatif dalam bahasa Inggris dengan berbagai teks, lisan, tulis, visual, audio visual, atau multimodal; 2. mengembangkan kompetensi interkultural untuk memahami dan menghargai perspektif, praktik, dan produk budaya Indonesia dan budaya asing; 3. mengembangkan kepercayaan diri untuk berekspresi sebagai individu yang mandiri dan bertanggung jawab; dan 4. mengembangkan keterampilan bernalar kritis dan kreatif.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"informatika":{"judul":"Informatika","hal":177,"fase":{"E":[{"nama":"Berpikir Komputasional","cp":"Memahami konsep struktur data dan algoritma standar; menerapkan proses komputasi yang dilakukan manusia secara mandiri atau berkelompok untuk mendapatkan data yang berkualitas; menerapkan algoritma dan struktur data standar untuk menghasilkan berbagai solusi dalam menyelesaikan persoalan; menuliskan solusi rancangan program sederhana dalam format pseudocode yang dekat dengan bahasa komputer; memahami model dan menyimulasikan dinamika Input-Process-Output dalam sebuah komputer Von Neumann, serta memahami peran sistem operasi."},{"nama":"Literasi Digital Memahami penggunaan mesin pencari dengan","cp":"variabel yang lebih banyak; mengetahui ekosistem periksa fakta untuk memilah fakta dan bukan; menggunakan cara membaca lateral untuk mengevaluasi berbagai informasi digital; memahami pemanfaatan perangkat teknologi yang lebih beragam untuk pengolah dokumen, lembar kerja, dan presentasi; memahami konsep dan penerapan serta konfigurasi keamanan dasar untuk konektivitas jaringan data lokal dan internet baik kabel maupun nirkabel; memahami pemanfaatan media digital untuk produksi dan diseminasi konten, partisipasi dan kolaborasi; menghargai hak atas kekayaan intelektual, mengenal profesi bidang Informatika, memahami penerapan digitalisasi budaya Indonesia, menyaring konten negatif di dunia digital; menerapkan pengelolaan kata sandi dengan manajer kata sandi, dan menerapkan autentikasi dua langkah secara sederhana, serta menerapkan konfigurasi privasi dan keamanan pada akun platform digital."}],"F":[{"nama":"Berpikir Komputasional","cp":"Memahami alur proses pengembangan program atau produk teknologi digital; menganalisis persoalan yang bisa menghasilkan lebih dari satu solusi dengan pemahamannya terhadap beberapa strategi algoritmik untuk menghasilkan beberapa alternatif solusi dari satu persoalan dengan memberikan justifikasi efisiensi, kelebihan, dan keterbatasan dari setiap alternatif solusi; mampu memilih dan menerapkan solusi terbaik, paling efisien, dan optimal dengan merancang struktur data yang lebih kompleks dan abstrak; serta mengenali berbagai model jaringan komputer serta mampu melakukan pengiriman data antar perangkat dalam jaringan komputer dan troubleshooting permasalahan jaringan komputer."},{"nama":"Literasi Digital Memahami penggunaan mesin pencari untuk","cp":"melakukan riset; mengevaluasi kebenaran konten menggunakan verifikasi teks, gambar, dan video; menggunakan cara membaca lateral untuk mengevaluasi informasi digital yang kompleks; merancang kebutuhan sistem komputer sesuai kebutuhan pengguna; memahami konsep dan penerapan serta konfigurasi keamanan lanjut untuk konektivitas jaringan data lokal dan internet baik kabel maupun nirkabel; mengkreasi konten digital dengan peralatan dan metode yang bervariasi; memahami hukum dan perundang-undangan terkait isu digital di Indonesia; memahami pemanfaatan teknologi digital dalam demokrasi; menerapkan pengelolaan kata sandi dengan manajer kata sandi dan autentikasi dua langkah dengan beragam moda; serta memahami pemanfaatan platform loka pasar, perbankan digital, dompet digital beserta aspek keamanannya."},{"nama":"Analisis Data Memanfaatkan sumber data yang terbuka,","cp":"terpercaya, dan legal untuk mengolah data untuk pengambilan keputusan dan prediksi secara efektif, efisien, dan optimal tanpa atau dengan komputer."},{"nama":"Algoritma dan Pemrograman Memahami konsep strategi algoritmik;","cp":"mengembangkan program komputer terstruktur dalam notasi algoritma atau notasi lain berdasarkan strategi algoritmik yang tepat; mengembangkan, melakukan pemeliharaan, dan penyempurnaan algoritma standar ke dalam kode sumber program dengan memperhatikan kualitasnya; merancang dan mengimplementasikan sebuah program yang menggunakan struktur data kompleks dan tepat menggunakan library atau perangkat yang tersedia."}]},"tujuan":"Mata pelajaran Informatika bertujuan untuk mengantarkan murid menjadi well-being and wise digital citizen dan computationally literate creators yang menguasai konsep dan praktik informatika sehingga murid 1. Terampil berpikir komputasional untuk menciptakan solusi atau penyelesaian persoalan secara logis, sistematis, kritis, analitis, dan kreatif; 2. Cakap dan bijak sebagai individu yang menjadi warga negara sekaligus menjadi warga masyarakat digital yang produktif, beretika, berbudaya, aman, nyaman, dan seimbang; 3. Berkarakter baik dalam berkomunikasi, berkreasi, berkolaborasi, dan berinteraksi pada masyarakat digital, serta peduli terhadap dampaknya dalam kehidupan bermasyarakat; dan 4. Terampil berkarya dengan menghasilkan gagasan solusi dalam bentuk rancangan atau implementasinya yang berlandaskan informatika dengan memanfaatkan teknologi dan menerapkan proses rekayasa, serta mengintegrasikan pengetahuan bidang-bidang lain yang membentuk solusi sistemik.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"pjok":{"judul":"Pendidikan Jasmani, Olahraga, dan Kesehatan","hal":302,"fase":{"E":[{"nama":"Terampil Bergerak","cp":"Menerapkan keterampilan gerak spesifik di dalam berbagai situasi gerak yang menantang; mengembangkan strategi gerak untuk mendapatkan keberhasilan capaian keterampilan gerak melintasi berbagai situasi gerak yang menantang."},{"nama":"Belajar Melalui Gerak","cp":"Merefleksikan transfer strategi gerak yang telah dikuasai dalam situasi gerak yang berbeda; memperagakan fair play dan mengevaluasi pengaruh perilaku etis terhadap capaian aktivitas jasmani bagi individu dan kelompok; serta menerapkan strategi pengambilan keputusan dalam kerja tim yang mempertunjukkan keterampilan kepemimpinan dan kolaborasi."},{"nama":"Bergaya Hidup Aktif","cp":"Berpartisipasi dalam aktivitas kebugaran dan menginvestigasi dampak partisipasi yang teratur terhadap kesehatan; merancang strategi peningkatan aktivitas kebugaran untuk kesehatan."},{"nama":"Memilih Hidup yang Menyehatkan","cp":"Mengevaluasi risiko kesehatan akibat gaya hidup dan tindakan pencegahan melalui aktivitas jasmani serta mempromosikannya menggunakan berbagai media; mengevaluasi pola makan sehat berdasarkan analisis kandungan gizi sesuai kebutuhan aktivitas jasmani. murid mempraktikkan pertolongan pertama."}],"F":[{"nama":"Terampil Bergerak","cp":"Mengevaluasi keterampilan gerak spesifik di dalam berbagai situasi gerak yang menantang untuk meningkatkan kinerja gerak; mengevaluasi strategi gerak untuk mendapatkan keberhasilan capaian keterampilan gerak melintasi berbagai situasi gerak yang menantang"},{"nama":"Belajar Melalui Gerak","cp":"Mengevaluasi strategi gerak yang telah dikuasai dalam situasi gerak baru yang menantang; mengevaluasi fair play dan merefleksikan pengaruh perilaku etis terhadap capaian aktivitas jasmani bagi individu dan kelompok; dan mengevaluasi strategi pengambilan keputusan dalam kerja tim yang mempertunjukkan keterampilan kepemimpinan dan kolaborasi."},{"nama":"Bergaya Hidup Aktif","cp":"Berpartisipasi dalam aktivitas kebugaran dan mengevaluasi dampak partisipasi yang teratur terhadap kesehatan; mengevaluasi efektivitas strategi peningkatan aktivitas kebugaran untuk kesehatan."},{"nama":"Memilih Hidup yang Menyehatkan","cp":"Mengadvokasi gaya hidup aktif dan sehat melalui aktivitas jasmani menggunakan berbagai media; mengadvokasi pola makan sehat dan bergizi seimbang kepada orang lain sesuai kebutuhan aktivitas jasmaninya; dan mempraktikkan tindakan penyelamatan hidup sesuai prosedur operasional standar (POS)."}]},"tujuan":"Pendidikan Jasmani, Olahraga, dan Kesehatan (PJOK) bertujuan sebagai pembelajaran bagi murid dalam: 1. mengembangkan, menerapkan, dan mengevaluasi keterampilan, konsep, dan strategi gerak yang akan menjadi disposisi untuk berpartisipasi dalam berbagai aktivitas jasmani dengan penuh kepercayaan diri, kompetensi, dan kreativitas; 2. membantu dan memberi dukungan mereka dalam memilih gaya hidup sehat dan aktif secara jasmani; 3. membangun dan menerapkan keterampilan sosial dan emosional melalui konteks pembelajaran yang menekankan nilai-nilai fair play, kerja tim, dan inklusivitas; dan 4. menanamkan apresiasi dan mengembangkan sikap positif untuk aktif secara jasmani sepanjang hayat sebagai upaya peningkatan keseluruhan kualitas hidup.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"seni_rupa":{"judul":"Seni Rupa","hal":243,"fase":{"E":[{"nama":"Mengalami (Experiencing)","cp":"Mengeksplorasi unsur rupa dan prinsip desain dalam benda-benda di sekitar/karya seni rupa."},{"nama":"Merefleksikan (Reflecting)","cp":"Merefleksikan penggunaan unsur rupa, prinsip desain, dan fungsi dalam karya diri sendiri dan teman sekelas menggunakan kosa kata seni rupa yang sesuai."},{"nama":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","cp":"Mengeksplorasi alternatif/potensi alat dan bahan yang ada di lingkungan sekitar dan menghubungkan seni dengan kelompok atau bidang keilmuan lain dalam berkarya seni rupa."},{"nama":"Menciptakan (Making/Creating) Membuat karya seni rupa berdasarkan","cp":"pengalaman dan/atau hasil pengamatan terhadap lingkungan sekitar, dengan mempertimbangkan fungsi, menggunakan gaya atau teknik yang dipilih."},{"nama":"Berdampak (Impacting)","cp":"Menghasilkan karya seni rupa untuk mengajak orang lain, merespon pengalaman sehari-hari, dan mengekspresikan perasaan atau minat."}],"F":[{"nama":"Mengalami (Experiencing)","cp":"Mengeksplorasi penggunaan unsur rupa dan prinsip desain dalam benda-benda di sekitar/karya seni rupa."},{"nama":"Merefleksikan (Reflecting)","cp":"Merefleksikan penggunaan unsur rupa, prinsip desain, dan fungsi dalam karya diri sendiri dan teman sekelas menggunakan kosa kata seni rupa yang sesuai."},{"nama":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","cp":"Menganalisis potensi alat dan bahan yang ada di lingkungan sekitar dan keterhubungan seni rupa dengan kelompok atau bidang keilmuan lain dalam berkarya."},{"nama":"Menciptakan (Making/Creating) Membuat karya seni rupa berdasarkan","cp":"pengalaman dan/atau hasil pengamatan terhadap lingkungan sekitar, dengan mempertimbangkan fungsi, menggunakan gaya atau teknik yang dikuasai."},{"nama":"Berdampak (Impacting)","cp":"Menghasilkan karya seni rupa untuk mengajak orang lain, merespon pengalaman sehari-hari, mengekspresikan perasaan, minat, dan/atau isu sosial dalam masyarakat."}]},"tujuan":"Mata pelajaran Seni Rupa bertujuan agar murid mampu: 1. menunjukkan kepekaan terhadap persoalan diri dan lingkungan, dan menemukan solusi kreatif untuk menanggapi dan mengatasi masalah; 2. mengekspresikan diri dan mengasah kreativitas melalui penciptaan karya seni rupa; 3. memberdayakan sumber daya (alat dan bahan) yang tersedia di sekitarnya untuk menciptakan sebuah karya seni; dan 4. menemukan jawaban terhadap suatu masalah atau mendapatkan gagasan untuk menciptakan karya seni melihat suatu hal melalui beberapa sudut pandang sehingga dapat menciptakan karya seni yang berdampak bagi diri sendiri dan orang lain.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"seni_musik":{"judul":"Seni Musik","hal":234,"fase":{"E":[{"nama":"Mengalami (Experiencing)","cp":"Mengidentifikasi dan menjelaskan unsur-unsur musik berupa nada, irama, melodi, harmoni, timbre, tempo, dan dinamika menggunakan alat musik dengan teknologi yang sesuai dengan kondisi setempat, serta menganalisis musik dari berbagai genre, era, dan instrumen yang digunakan."},{"nama":"Merefleksikan (Reflecting)","cp":"Menjelaskan hasil analisis kemampuan bermain musik dan karya musik diri sendiri atau orang lain, sesuai dengan teknik dan genre menggunakan istilah musik yang tepat"},{"nama":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","cp":"Menjalani proses praktik musik dengan penuh kesadaran untuk perbaikan dan perkembangan keterampilan bermusik; menyajikan musik nusantara dengan penuh ekspresi; dan menyajikan karya-karya musik modern Indonesia dengan interpretasi dan ekspresi yang tepat, baik secara individu maupun berkelompok."},{"nama":"Menciptakan (Creating)","cp":"Menciptakan, menyajikan dan mendokumentasikan karya musik kreasi sendiri untuk mengekspresikan pengalaman pribadi maupun persoalan di masyarakat."},{"nama":"Berdampak (Impacting)","cp":"Menerapkan dampak positif dari kegiatan bermusik dalam perilaku di kehidupan sehari-hari."}],"F":[{"nama":"Mengalami (Experiencing)","cp":"Menyimak dan mengeksplorasi unsur-unsur musik (nada, irama, melodi, harmoni, timbre, tempo, dan dinamika) menggunakan alat musik dengan teknologi yang sesuai dengan kondisi setempat; murid mampu mengevaluasi karya-karya musik secara musikal dan bertanggung jawab."},{"nama":"Merefleksikan (Reflecting)","cp":"Menerapkan hasil evaluasi praktik bermain musik baik sendiri maupun kelompok."},{"nama":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","cp":"Menjalani dan mendokumentasikan kebiasaan bermusik secara mandiri atau berkolaborasi dengan baik dan cermat; murid mampu menunjukkan penguasaan unsur-unsur musik, pemahaman dan keterampilan bermusik, serta keberagaman konteks dalam praktik musik; murid mampu menyajikan ansambel musik remaja menggunakan karya musik mancanegara dengan teknologi yang sesuai kondisi setempat."},{"nama":"Menciptakan (Creating)","cp":"Menciptakan, menyajikan dan mendokumentasikan karya kolaborasi dengan menerapkan manajemen pementasan."},{"nama":"Berdampak (Impacting)","cp":"Menghayati kegiatan bermusik yang kolaboratif dan kompleks, memperluas pengalaman, meningkatkan keterampilan bermain musik, serta penerapannya dalam kehidupan sehari-hari."}]},"tujuan":"Mata Pelajaran Seni Musik bertujuan agar murid mampu: 1. menggunakan musik sebagai media untuk mengekspresikan diri atas fenomena kehidupan yang terjadi pada diri sendiri, sesama, dan alam sekitar; 2. memiliki kepekaan terhadap permasalahan yang terjadi pada diri sendiri, lingkungan sekitar, negara maupun dunia; 3. mengasah dan mengembangkan musikalitas, terlibat dengan praktik-praktik bermusik yang kreatif dan inovatif dengan cara yang sesuai, tepat, dan bermanfaat, serta turut ambil bagian dan mampu menjawab tantangan dalam kehidupan sehari-hari; dan 4. secara sadar dan bermartabat mengusahakan perkembangan kepribadian, karakter, dan kehidupannya untuk diri sendiri, sesama serta alam sekitar.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"seni_tari":{"judul":"Seni Tari","hal":250,"fase":{"E":[{"nama":"Mengalami (Experiencing)","cp":"Menginterpretasi makna dan simbol pada tari tradisi/tari kreasi dalam bentuk karya seni pertunjukan."},{"nama":"Merefleksikan (Reflecting)","cp":"Membandingkan makna dan simbol dengan mengapresiasi tari tradisi/tari kreasi."},{"nama":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","cp":"Merancang karya tari tradisi/tari kreasi secara individu maupun berkelompok."},{"nama":"Menciptakan (Creating)","cp":"Menata gerak tari berdasarkan makna dan simbol dari tari tradisi/tari kreasi dalam bentuk karya seni pertunjukan."},{"nama":"Berdampak (Impacting)","cp":"Mengaktualisasikan diri melalui pertunjukan tari."}],"F":[{"nama":"Mengalami (Experiencing)","cp":"Mengelaborasi tari tradisi/tari kreasi berdasarkan makna, simbol, nilai estetis dari sudut pandang aspek seni sesuai dengan pengalaman dan wawasan."},{"nama":"Merefleksikan (Reflecting)","cp":"Mengevaluasi hasil penciptaan karya tari dengan mengapresiasi nilai estetis tari tradisi/tari kreasi berdasarkan makna dan simbol."},{"nama":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","cp":"Mengembangkan penciptaan tari tradisi/kreasi secara individu ataupun kelompok dengan manajemen pertunjukan."},{"nama":"Menciptakan (Creating)","cp":"Mengkomposisi tari yang terinspirasi dari hasil membandingkan berbagai pertunjukan tari tradisi/tari kreasi berdasarkan makna, simbol, nilai estetis."},{"nama":"Berdampak (Impacting)","cp":"Memiliki karakter diri sehingga dapat mempengaruhi orang lain untuk memberikan apresiasi pertunjukan tari."}]},"tujuan":"Mata pelajaran Seni Tari bertujuan agar murid mampu: 1. meningkatkan multi kecerdasan, khususnya kinestetik sebagai ungkapan ekspresi, gagasan, perasaan, kreativitas, dan imajinasi estetis dan artistik, kehalusan budi dalam mengontrol dan mengatur tubuh dengan percaya diri; 2. mengolah tubuh mengembangkan fleksibilitas, keseimbangan, dan kesadaran diri yang mengasah kreativitas dan imajinasi yang diungkapkan melalui komunikasi gerak tari yang indah dan artistik; 3. meningkatkan kepekaan rasa dan nilai estetis, seni, dan budaya tari dalam konteks masa lalu, masa kini, dan masa mendatang; 4. memahami sejarah tari tradisi dari berbagai sumber dan aktivitas seni yang bermakna, pembentukan identitas bangsa, penghargaan dalam keragaman dan pelestarian budaya Indonesia; 5. mengembangkan tari tradisi Indonesia dan menyebarluaskannya sebagai usaha interaksi sosial dan komunikasi antarbudaya dalam konteks global; dan 6. mengembangkan diri dalam berpikir kritis, berkolaborasi, berinovasi, dan menguasai teknologi.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"seni_teater":{"judul":"Seni Teater","hal":260,"fase":{"E":[{"nama":"Mengalami (Experiencing)","cp":"Menginterpretasi dialog atau naskah dengan ragam teater bergenre propaganda, serta tokoh dan perwatakannya berdasar analisis karakteristik dan sosiologis untuk menunjang pesan/isu cerita secara realis."},{"nama":"Merefleksikan (Reflection) Mengapresiasi dan memberikan umpan balik","cp":"mengenai pesan, kualitas akting, tata artistik, teknologi, dan elaborasi genre pada suatu karya, dengan menggunakan kosakata seni teater yang tepat dan argumentasi berdasarkan teori yang dipelajari."},{"nama":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","cp":"Mengeksplorasi berbagai peran dan tata artistik panggung yang sesuai dengan cerita/genre yang dipertunjukkan di panggung maupun secara digital."},{"nama":"Menciptakan (Creating)","cp":"Mengeksplorasi beragam peran realis, penulisan naskah orisinal, dan penyusunan cerita/alur pertunjukan."},{"nama":"Berdampak (Impacting) Menghasilkan naskah atau pertunjukan","cp":"berdasarkan minat, pengetahuan, peristiwa aktual, pengalaman, empati, kreativitas, dan respons terhadap isu sosial dalam masyarakat."}],"F":[{"nama":"Mengalami (Experiencing)","cp":"Menerapkan teknik keaktoran melalui bahasa tubuh, mimik wajah dan vokal untuk menunjukkan kepekaan terhadap persoalan sosial, dan eksplorasi komunikasi nonverbal; melakukan pengamatan mengenai ragam teknik/genre teater, ide penokohan dan peristiwa yang berasal dari karya profesional sebagai inspirasi dalam memproduksi dan menampilkan pertunjukan secara berkolaborasi dengan memanfaatkan platform digital."},{"nama":"Merefleksikan (Reflection) Mengapresiasi dan memberikan umpan balik","cp":"mengenai pesan, kualitas akting, tata artistik, teknologi, dan elaborasi genre, pada suatu karya, dengan menggunakan kosakata seni teater yang tepat dan argumentasi berdasarkan teori yang dipelajari."},{"nama":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","cp":"Merancang tata artistik berdasarkan peran dan cerita untuk produksi."},{"nama":"Menciptakan (Creating)","cp":"Menciptakan peran baru, naskah orisinal, dan menyusun kembali cerita/alur pertunjukan yang memperlihatkan kejelasan alur dan dinamika cerita/emosi di panggung maupun secara digital."},{"nama":"Berdampak (Impacting) Menghasilkan naskah atau pertunjukan","cp":"berdasarkan minat, pengetahuan, peristiwa aktual, pengalaman, empati, kreativitas, dan respons terhadap ragam topik yang dipilihnya, sehingga memberi dampak positif bagi dirinya dan lingkungan sekitarnya."}]},"tujuan":"Mata pelajaran Seni Teater bertujuan agar murid mampu: 1. menunjukkan kepekaan terhadap persoalan diri dan lingkungan sekitar dan untuk mencari solusi kreatif melalui ekspresi diri; 2. mengeksplorasi diri dan melakukan permainan peran dengan menggunakan imajinasi dan sumber daya yang dimilikinya (tubuh, suara, rasa, dan lingkungan); 3. menguasai teknik, eksplorasi alat, bahan, dan teknologi yang diperlukan untuk menciptakan sebuah karya seni teater; 4. mengomunikasikan gagasan atau pesan melalui sebuah karya seni teater; dan menggunakan berbagai sudut pandang dalam melihat suatu permasalahan di lingkungannya, melalui permainan peran; dan menciptakan karya seni dengan penuh tanggung jawab dan kesadaran bahwa setiap karya dapat berdampak, baik bagi dirinya maupun orang lain; dan 5. menciptakan karya seni dengan penuh tanggung jawab dan kesadaran bahwa setiap karya dapat berdampak, baik bagi dirinya maupun orang lain.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"sejarah":{"judul":"Sejarah (rujukan BSKAP, Fase E)","hal":348,"fase":{"E":[{"nama":"Pemahaman Konsep","cp":"Memahami konsep dasar ilmu sejarah, mengkritisi dan menafsirkan peristiwa sejarah terkait kehidupan masyarakat Indonesia masa kerajaan Hindu-Buddha, kerajaan Islam, penjajahan bangsa Barat, perlawanan rakyat daerah terhadap penjajah, pergerakan kebangsaan Indonesia."},{"nama":"Keterampilan Proses","cp":"Memahami konsep dasar ilmu sejarah dan mampu berpikir sejarah melalui proses mengamati fenomena sejarah, menanya, mengumpulkan informasi, menganalisis informasi, mengomunikasikan dan mengaitkannya dengan muatan vokasional yang sesuai dengan kompetensi kejuruan yang diampunya. Secara spesifik keterampilan proses belajar sejarah mencakup keterampilan berpikir diakronis (kronologis), berpikir sinkronis, analisis dan interpretasi sejarah, penulisan sejarah secara sederhana, analisis isu kesejarahan serta, menemukan kebermaknaan peristiwa sejarah pada masa kerajaan Hindu-Buddha, kerajaan Islam, penjajahan bangsa Barat, perlawanan rakyat daerah terhadap penjajah, pergerakan kebangsaan Indonesia. Keterampilan proses pembelajaran sejarah dapat dilakukan dengan cara: ● Mengamati, melalui pencermatan fenomena sejarah terkait dengan berbagai peristiwa yang terjadi dalam kehidupan manusia sesuai dengan materi yang dipelajari. ● Menanya, melalui pengembangan pertanyaan/permasalahan tentang hal yang ingin diketahui dan masalah yang sedang diselidiki dengan rumus 5W 1H (apa, siapa, kapan, di mana, mengapa, dan bagaimana). ● Mengumpulkan informasi (heuristik), melalui pencarian dan pengelompokan sumber informasi sejarah (sumber primer dan sekunder) melalui studi dokumen/arsip, studi pustaka, wawancara, dan studi lapangan terhadap objek-objek peninggalan sejarah. ● Menganalisis informasi (kritik sumber), melalui penyeleksian sumber, verifikasi, triangulasi/cek silang akurasi data dan fakta sejarah, serta interpretasi data dan fakta sejarah. ● Menarik kesimpulan, melalui penarasian temuan hasil investigasi terhadap permasalahan terkait materi pelajaran sejarah. ● Mengomunikasikan, melalui penyajian informasi sejarah secara lisan dan/atau tulisan dalam bentuk digital maupun nondigital. ● Merefleksikan dan merencanakan projek lanjutan secara kolaboratif, melalui evaluasi dan perencanaan projek lanjutan lintas mata pelajaran secara kolaboratif."}]},"tujuan":"Mata Pelajaran Sejarah SMK/MAK bertujuan membekali murid untuk: 1. menumbuhkembangkan kesadaran sejarah; 2. menumbuhkembangkan pemahaman tentang dimensi manusia (menggali pemikiran, motif, tindakan), dimensi ruang (mengaitkan antara peristiwa lokal, nasional dan global) dan dimensi waktu (menghubungkan masa lampau, masa kini, dan masa akan datang) dengan melihat pola perkembangan, keberlanjutan/kesinambungan, pengulangan dan juga perubahan; 3. menumbuhkembangkan pemahaman tentang diri sendiri dan pemahaman kolektif sebagai bangsa Indonesia yang memiliki nilai-nilai nasionalisme, dan patriotisme; 4. meningkatkan kecakapan berpikir sejarah yang diakronis (kronologis), sinkronis, kausalitas, imajinatif, kritis, kreatif, reflektif, kontekstual dan multiperspektif untuk mengambil keputusan masa kini dan masa depan berdasarkan fakta sejarah; 5. memecahkan suatu masalah dengan menggunakan konsep dan metode sejarah; 6. menunjukkan kemampuan literasi sejarah dalam mengkritisi dan menyajikan informasi sejarah secara lisan, tulisan, dan/atau media lain, dalam bentuk digital atau non digital; dan 7. menumbuhkembangkan kecintaan terhadap kevokasian (kompetensi kejuruan).","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"ipas":{"judul":"Projek IPAS (rujukan BSKAP, Fase E)","hal":354,"fase":{"E":[{"nama":"Menjelaskan Fenomena secara Ilmiah","cp":"Menjelaskan pengetahuan ilmiah; membuat prediksi sederhana disertai dengan pembuktian fenomena-fenomena yang terjadi di lingkungan sekitarnya dilihat dari berbagai aspek seperti makhluk hidup dan lingkungannya, zat dan perubahannya, energi dan perubahannya, keruangan dan konektivitas antarruang dan antarwaktu, interaksi, komunikasi, sosialisasi, institusi sosial dan dinamika sosial, serta perilaku ekonomi dan kesejahteraan dan mengaitkan fenomena-fenomena tersebut dengan keterampilan teknis pada bidang keahliannya."},{"nama":"Menyusun Penyelidikan Ilmiah","cp":"Menyusun percobaan dengan menerapkan prosedur penyelidikan ilmiah dan memeriksa kekurangan atau kesalahan pada rancangan percobaan ilmiah tersebut."},{"nama":"Merefleksikan Data dan Bukti-bukti secara Ilmiah","cp":"Membuktikan dengan prinsip dasar melalui data dan bukti dari berbagai sumber seperti tabel hasil, grafik, atau sumber data lain untuk membangun sebuah argumen dan dapat mempertahankan argumen tersebut dengan penjelasan ilmiah, mengomunikasikan proses dan hasil, dan melakukan refleksi diri terhadap tahapan kegiatan yang dilakukan."}]},"tujuan":"Mata pelajaran Projek IPAS bertujuan membekali murid dengan hard skills dan soft skills untuk: 1. memadukan pola pikir, perilaku, dan membangun karakter murid untuk peduli dan bertanggung jawab terhadap dirinya, masyarakat, dan alam semesta, serta permasalahan yang dihadapi; 2. menganalisis manfaat potensial dan resiko dari penggunaan sumber daya alam; 3. menyusun pengembangan alternatif keputusan yang mendasar dengan menggunakan sains serta teknologi; 4. menemukan solusi dari masalah yang dihadapi melalui sains baik masalah personal maupun sosial; dan 5. merefleksikan pengambilan keputusan secara ilmiah agar dapat hidup lebih bijak dan lebih baik.","sumber":"Keputusan Kepala BSKAP 046/H/KR/2025"},"qh":{"judul":"Al-Qur’an Hadis (MA)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Ilmu Al-Qur’an","cp":"Memahami hal ihwal Ilmu Al Qur’an yang meliputi: pengertian Al-Qur`an menurut pendapat para ulama, sejarah turun dan kodifikasinya, bukti-bukti keautentikan, kemukjizatan, pokok-pokok kandungan, dan struktur Al-Qur’an, untuk meyakini kebenaran Al-Qur’an dan mengamalkan pesan Al-Qur’an dalam konteks kehidupan beragama, berbangsa, dan bernegara."},{"nama":"Ilmu Hadis","cp":"Memahami hal ihwal tentang Ilmu Hadis yang meliputi: perbedaan hadis, sunnah, khabar, dan atsar, sejarah kodifikasi dan perkembangan hadis, unsur-unsur hadis, kedudukan dan fungsi hadis terhadap ayat Al-Qur`an, pembagian hadis, serta tokoh-tokoh ulama hadis untuk meyakini kebenaran hadis-hadis dan mengamalkannya dalam konteks kehidupan bermasyarakat, berbangsa, dan bernegara."}],"F":[{"nama":"Al-Qur’an","cp":"Memahami kandungan ayat-ayat Al-Qur’an tentang manusia sebagai khalifah Allah, perintah berbuat baik kepada kedua orang tua, menghindari perbuatan keji, toleransi, kewajiban menuntut ilmu pengetahuan dan pengembangannya, tanggung jawab manusia, berkompetisi dalam kebaikan, menyikapi kehidupan dunia yang sementara dan akhirat yang kekal, makanan yang halal dan baik, kewajiban bersyukur, pola hidup sederhana, sabar menghadapi cobaan, pelestarian lingkungan, kewajiban dakwah, amar ma’ruf nahi munkar, musyawarah dan demokrasi, serta bersikap jujur dan adil dalam konteks kehidupan beragama, berbangsa, dan bernegara."},{"nama":"Hadis","cp":"Memahami hadis tentang manusia sebagai khalifah Allah, perintah berbuat baik kepada kedua orang tua, menghindari perbuatan keji, toleransi, kewajiban menuntut ilmu pengetahuan dan pengembangannya, tanggung jawab manusia, berkompetisi dalam kebaikan, menyikapi kehidupan dunia yang sementara dan akhirat yang kekal, makanan yang halal dan baik, kewajiban bersyukur, pola hidup sederhana, sabar menghadapi cobaan, pelestarian lingkungan, kewajiban dakwah, amar ma’ruf nahi munkar, musyawarah dan demokrasi, serta bersikap jujur dan adil dalam konteks kehidupan, beragama, berbangsa, dan bernegara."}]},"tujuan":"Secara substansial, mata pelajaran Al-Qur’an Hadis bertujuan memberikan motivasi kepada peserta didik untuk mencintai kitab sucinya, mempelajari, dan mempraktikkan ajaran dan nilai-nilai yang terkandung dalam Al-Qur’an dan Hadis sebagai sumber utama ajaran Islam dan sekaligus menjadi pegangan hidup dalam kehidupan sehari-hari. Tujuan pembelajaran mata pelajaran Al-Qur’an Hadis antara lain: 1. Meningkatkan kecintaan peserta didik terhadap Al-Qur'an dan Hadis; 2. Membimbing peserta didik agar mampu membaca, menerjemahkan, menganalisis kandungan ayat-ayat Al-Qur’an dan Hadis; 3. Membekali peserta didik dengan dalil-dalil yang terdapat dalam Al-Qur’an dan Hadis sebagai pedoman dalam kehidupan dan solusi dalam menyelesaikan segala permasalahannya; 4. Meningkatkan pemahaman peserta didik secara tekstual dan kontekstual dan pengamalan isi kandungan Al-Qur’an dan Hadis secara komprehensif dan mendalam; 5. Melahirkan perubahan sikap dan perilaku peserta didik sebagaimana nilai-nilai yang diajarkan dalam Al-Qur’an dan Hadis; 6. Membekali kemampuan untuk mengeksplorasi makna-makna ayat dalam rangka menilai, memilih, dan memilah pemaknaan yang salih li kulli zamanin wa makanin wa halin."},"qh_tafsir":{"judul":"Tafsir (MA Program Keagamaan)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Hubungan Manusia dengan Allah Swt.","cp":"Memahami makna tekstual serta kontekstual ayat Al-Qur’an sesuai dengan pendapat mufassir yang shahih tentang kebesaran dan kekuasaan Allah Swt., menaati Allah Swt., dan Rasul Saw., agar memiliki wawasan yang luas dalam memaknai ibadah, lebih toleran dan moderat untuk menyikapi kehidupan masyarakat global dalam konteks berbangsa dan bernegara."},{"nama":"Hubungan Manusia dengan Sesamanya","cp":"Memahami makna tekstual serta kontekstual ayat Al-Qur’an sesuai dengan pendapat mufassir yang shahih tentang berbuat baik kepada orang tua, tanggungjawab terhadap diri sendiri, keluarga dan masyarakat, agar memiliki kemampuan menjalin hubungan yang baik dan harmonis sesama manusia yang bernilai ibadah berdimensi ukhrawi pada kehidupan masyarakat global, dalam konteks berbangsa dan bernegara."},{"nama":"Sikap Manusia terhadap Dirinya Sendiri","cp":"Memahami makna tekstual serta kontekstual ayat Al-Qur’an sesuai dengan pendapat mufassir yang shahih tentang ayat-ayat semangat menuntut ilmu, disiplin dan etos kerja, serta berkompetisi dalam kebaikan, agar memiliki kapasitas dan kepercayaan diri untuk membangun kesalehan individu dan sosial pada kehidupan masyarakat global, dalam konteks berbangsa dan bernegara."}],"F":[{"nama":"Hubungan Manusia dengan Allah Swt.","cp":"Memahami makna tekstual serta kontekstual ayat Al-Qur’an sesuai dengan pendapat mufassir yang shahih tentang mensyukuri nikmat Allah Swt., sabar dalam menghadapi ujian dan cobaan, agar memiliki ketangguhan dan ketahanmalangan untuk menghadapi tantangan kehidupan masyarakat global dalam mencapai rida Allah."},{"nama":"Hubungan Manusia dengan Sesamanya","cp":"Memahami makna tekstual serta kontekstual ayat Al-Qur’an sesuai dengan pendapat mufassir yang shahih tentang toleransi dan etika pergaulan, kesantunan, menghindari pergaulan bebas, mencintai kedamaian, sikap peduli dan gemar berbagi, hidup gotong royong, amar ma’ruf nahi munkar, dan kewajiban berdakwah, agar memiliki kemampuan menjalin hubungan yang produktif dan harmonis sesama manusia pada kehidupan masyarakat global, dalam konteks berbangsa dan bernegara."},{"nama":"Sikap Manusia terhadap Dirinya Sendiri","cp":"Memahami makna tekstual serta kontekstual ayat Al-Qur’an sesuai dengan pendapat mufassir yang shahih tentang makanan minuman yang halal dan baik, serta makanan minuman yang haram, sebagai sarana pensucian hati untuk membentuk kepribadian yang berakhlak karimah dalam menjalankan kehidupan masyarakat global, dalam konteks berbangsa dan bernegara."},{"nama":"Sikap Peduli terhadap Pelestarian Lingkungan Hidup","cp":"Memahami makna tekstual serta kontekstual ayat Al-Qur’an sesuai dengan pendapat mufassir yang shahih tentang sikap peduli terhadap pelestarian lingkungan hidup, sebagai upaya menjaga kesimbangan dan keberlanjutan kehidupan dunia global."},{"nama":"Sikap Amanah dalam Kepemimpinan","cp":"Memahami makna tekstual serta kontekstual ayat Al-Qur’an sesuai dengan pendapat mufassir yang shahih tentang perintah musyawarah, amanah dalam menjalankan kepemimpinan, dan sikap berlaku adil serta jujur, sebagai upaya mewujudkan kehidupan masyarakat yang demokratis dan bertanggungjawab dalam konteks Negara Kesatuan Republik Indonesia (NKRI)."}]},"tujuan":"1. Meningkatkan kesadaran, ketaatan, dan kecintaan peserta didik kepada Allah Swt., melalui penghayatan terhadap ayat-ayat Al-Qur’an yang relevan melalui kajian tafsir. 2. Membekali peserta didik membangun nilai spiritual melalui hablum minallah berdasarkan pemahaman ayat-ayat Al-Qur’an sebagaimana penjelasan mufassir yang shahih. 3. Membekali peserta didik kesiapan hidup bersama dengan orang lain (hablum minannas) berdasarkan ayat-ayat Al-Qur’an yang relevan dan kontekstual. 4. Meningkatkan pemahaman dan penghayatan peserta didik terhadap ayat-ayat Al-Qur’an tentang menjalin hubungan dengan diri sendiri dan lingkungannya. 5. Meningkatkan pemahaman dan penghayatan peserta didik terhadap ayat-ayat Al-Qur’an yang berkaitan dengan kehidupan berbangsa, kesiapan menjadi pemimpin yang amanah, jujur, dan adil."},"qh_hadis":{"judul":"Hadis (MA Program Keagamaan)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Hubungan Manusia dengan Allah Swt.","cp":"Memahami fungsi hadis terhadap ayat Al-Qur’an dan menyajikan makna hadis secara tekstual dan kontekstual sesuai dengan pendapat muhaddis yang shahih tentang kebesaran dan kekuasaan Allah Swt., menaati Allah Swt., dan Rasulullah Saw., dan keikhlasan dalam beribadah, agar mampu mengenal Allah dan membangun hubungan yang baik dengan Allah."},{"nama":"Hubungan Manusia dengan Sesamanya","cp":"Memahami fungsi hadis terhadap ayat Al-Qur’an dan menyajikan makna hadis secara tekstual dan kontekstual sesuai dengan pendapat muhaddis yang shahih tentang berbuat baik kepada orang tua dan menghindari pergaulan bebas, agar memiliki kemampuan menjalin hubungan yang baik dan harmonis antar sesama manusia dalam kehidupan keluarga dan masyarakat global, dalam konteks berbangsa dan bernegara."},{"nama":"Sikap Manusia terhadap Dirinya Sendiri","cp":"Memahami makna tekstual serta kontekstual hadis sesuai dengan pendapat muhadis yang shahih tentang ayat-ayat semangat menuntut ilmu, disiplin dan etos kerja serta berkompetisi dalam kebaikan, tanggungjawab terhadap diri sendiri, agar memiliki kapasitas dan kepercayaan diri untuk membangun kesalehan individu dan sosial pada kehidupan masyarakat global, dalam konteks berbangsa dan bernegara."}],"F":[{"nama":"Hubungan Manusia dengan Allah Swt.","cp":"Memahami makna tekstual serta kontekstual hadis sesuai dengan pendapat ahli hadis yang shahih tentang mensyukuri nikmat Allah Swt., sabar dalam menghadapi ujian dan cobaan, agar memiliki daya lenting, ketangguhan dan ketahanmalangan untuk menghadapi tantangan kehidupan masyarakat global dalam mencapai rida Allah."},{"nama":"Hubungan Manusia dengan Sesamanya","cp":"Memahami makna tekstual serta kontekstual hadis sesuai dengan pendapat ahli hadis yang shahih tentang toleransi dan etika pergaulan, kesantunan, menghindari pergaulan bebas, mencintai kedamaian, sikap peduli dan gemar berbagi, hidup gotong royong, amar ma’ruf nahi munkar, dan kewajiban berdakwah, agar memiliki kemampuan menjalin hubungan yang produktif dan harmonis sesama manusia pada kehidupan masyarakat global, dalam konteks berbangsa dan bernegara."},{"nama":"Sikap Manusia terhadap Dirinya Sendiri","cp":"Memahami fungsi hadis terhadap ayat Al-Qur’an, dan menyajikan makna hadis secara tekstual dan kontekstual sesuai dengan pendapat ahli hadis yang shahih tentang tanggungjawab terhadap diri sendiri, keluarga, dan masyarakat, makanan minuman yang halal dan baik, serta makanan minuman yang haram, sebagai sarana pensucian hati untuk membentuk kepribadian yang berakhlakul karimah dalam menjalankan kehidupan masyarakat global, dalam konteks berbangsa dan bernegara."},{"nama":"Sikap Peduli terhadap Pelestarian Lingkungan Hidup","cp":"Memahami makna tekstual serta kontekstual hadis sesuai dengan pendapat ahli hadis yang shahih tentang sikap peduli terhadap pelestarian lingkungan hidup, sebagai upaya menjaga keseimbangan dan keberlanjutan kehidupan dunia global."},{"nama":"Sikap Amanah dalam Kepemimpinan","cp":"Memahami makna tekstual serta kontekstual hadis sesuai dengan pendapat ahli hadis yang shahih tentang perintah musyawarah, amanah dalam menjalankan kepemimpinan, dan sikap berlaku adil serta jujur, sebagai upaya mewujudkan kehidupan masyarakat yang demokratis dan bertanggungjawab dalam konteks Negara Kesatuan Republik Indonesia."}]},"tujuan":"1. Meningkatkan kesadaran, ketaatan, dan kecintaan peserta didik kepada Allah Swt., melalui penghayatan terhadap hadis-hadis yang relevan. 2. Membekali peserta didik membangun nilai spiritual melalui hablum minallah berdasarkan pemahaman yang benar terhadap hadis-hadis yang shahih. 3. Membekali peserta didik kesiapan hidup bersama dengan orang lain (hablum minannas) berdasarkan hadis-hadis yang relevan dan kontekstual. 4. Meningkatkan pemahaman dan penghayatan peserta didik terhadap hadis-hadis tentang menjalin hubungan dengan diri sendiri dan lingkungannya. 5. Meningkatkan pemahaman dan penghayatan peserta didik terhadap hadis-hadis yang berkaitan dengan kehidupan berbangsa, kesiapan menjadi pemimpin yang amanah, jujur, dan adil."},"ilmu_tafsir":{"judul":"Ilmu Tafsir (MA Program Keagamaan)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[],"F":[{"nama":"Ilmu Al-Qur’an","cp":"Memahami hakikat Al-Qur’an meliputi: Al-Qur’an dan wahyu, kemukjizatan Al-Qur’an (i’jaz al-Qur’an), kedudukan dan fungsi Al-Qur’an, isi pokok ajaran Al-Qur’an, tafsir, Ilmu Tafsir, takwil dan terjemah, periodisasi tafsir, ayat-ayat Makkiyyah dan Madaniyyah dalam Al-Qur’an, munasabah ayat dalam Al-Qur’an, Ilmu Qira’at (ragam bacaan) dalam membaca Al-Qur’an, dan asbab al-nuzul, nasikh dan mansukh, muhkam dan mutasyabih dalam ayat-ayat Al-Qur’an, amtsal al-Qur’an (perumpamaan dalam memahami ayat Al-Qur’an), kaidah-kaidah tafsir dalam mempelajari tafsir Al-Qur’an, cerita-cerita (qasas al-Qur’an) untuk dapat diteladani dalam kehidupan, dan aqsam al-Qur’an (sumpah)."},{"nama":"Bentuk Tafsir Al-Qur’an","cp":"Memahami macam-macam tafsir dari segi sumbernya, meliputi tafsir bi al-ma’tsur (wahyu) dan tafsīr bi al-ra’yī (rasio), kode etik mufassir dan prosedur penafsiran (adab al-mufassir)."},{"nama":"Metode Tafsir","cp":"Memahami perbedaan antara metode tafsir tahlili (analisis), ijmali (global), maudu’i (tematis) dan muqarin (komparatif)."},{"nama":"Corak Tafsir","cp":"Memahami berbagai corak tafsir klasik dan kontemporer lughawi-adabi, fiqhi-ahkam, i’tiqadi, falsafi, sufi-isyari, ‘asri-‘ilmi, dan ijtima’i."}]},"tujuan":"Secara substansial, mata pelajaran Ilmu Tafsir bertujuan memberikan motivasi kepada peserta didik untuk mempelajari ilmu alat yang digunakan untuk memahami kitab suci Al-Qur’an, menganalisis penafsiran para mufassir, menyimpulkan penafsiran, meniru prosedur, metode, pendekatan, dan corak yang digunakan mufassir dalam menafsirkan Al-Qur’an, sehingga mampu menjadi generasi muslim yang menguasai ilmu agama Islam (faqih fi al-din). Pembelajaran Ilmu Tafsir di MAPK sebagai mata pelajaran peminatan, bertujuan untuk: 1. Meningkatkan kecintaan peserta didik terhadap Al-Qur'an dan keilmuan terkait. 2. Membekali peserta didik dengan dalil-dalil yang terdapat dalam Al-Qur’an sebagai pedoman dalam menyikapi dan menghadapi problematika kehidupan. 3. Meningkatkan pemahaman dan pengamalan isi kandungan Al-Qur’an yang dilandasi oleh dasar-dasar keilmuan tentang Al-Qur'an. 4. Meningkatkan kemampuan, pemahaman, penghayatan, dan pengamalan peserta didik tentang Ilmu Tafsir, sehingga dapat membekali mereka dalam menafsirkan ayat-ayat Al-Qur’an sesuai dengan kaidah-kaidah penafsiran yang benar. 5. Meningkatkan pengamalan peserta didik terhadap isi kandungan Al-Qur’an dengan penuh tanggung jawab dan bijaksana dalam kehidupan pribadi, bermasyarakat, berbangsa, dan bernegara, serta sebagai bekal untuk melanjutkan pendidikan pada jenjang yang lebih tinggi."},"ilmu_hadis":{"judul":"Ilmu Hadis (MA Program Keagamaan)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[],"F":[{"nama":"Ilmu Hadis Riwayah","cp":"Memahami sejarah perkembangan hadis dan Ilmu Hadis serta proses kodifikasi hadis, tahammul wa ada’ al-hadits, sejarah singkat para sahabat dan tabi’in yang banyak meriwayatkan hadis, enam imam hadis (al-aimmatu al-sittah), kitab hadis mu’tabarah (al-kutub at-tis’ah) beserta cara penyusunannya."},{"nama":"Ilmu Hadis Dirayah","cp":"Memahami berbagai pengertian, cabang, pengertian, pengarang dan kitab-kitab Ilmu Hadis, pengertian hadis, sunnah, khabar dan atsar, unsur-unsur hadis, kedudukan dan fungsi hadis terhadap Al-Qur’an, hadis berdasarkan kualitas dan kuantitas hadis, pembagian hadis berdasarkan sifat sanad dan tempat penyandaran, Ilmu Rijal al-Hadits, Ilmu Jarh wa Taʻdil, dan penelitian hadis dengan metode takhrij."}]},"tujuan":"Pada praktiknya, pembelajaran Ilmu Hadis ditujukan untuk: 1. Meningkatkan kemampuan pemahaman, penghayatan, dan pengamalan peserta didik tentang hadis sehingga menjadi manusia yang beriman dan bertakwa kepada Allah Swt., serta berakhlak mulia dan bijaksana dalam kehidupan pribadi, bermasyarakat, berbangsa, dan bernegara. 2. Mengenalkan sumber ajaran atau hukum Islam kepada peserta didik dalam melaksanakan ajaran atau hukum Islam dalam kehidupan sehari-hari, baik secara individu maupun sebagai anggota masyarakat. 3. Membekali peserta didik tentang dasar-dasar Ilmu Hadis dan cara sederhana untuk melakukan penelitian hadis guna menentukan kehujjahan suatu hadis atau otoritas hadis sebagai sumber ajaran Islam."},"aa":{"judul":"Akidah Akhlak (MA)","hal":"","sumber":"Keputusan Direktur Jenderal Pendidikan Islam Nomor 3302 Tahun 2024","fase":{"E":[{"nama":"Akidah","cp":"Memahami sifat wajib bagi Allah (nafsiyah, salbiyah, ma'ani, dan ma'nawiyah), sifat mustahil bagi Allah Swt., sifat jaiz bagi Allah Swt., dan al-Asma' al-Husna (al Karim, al-Hakam al-Haq, al-Matiin, al Jaami', al-Hafiz, ar-Rafi', al-Wahhab, ar Rakib, al-Mubdi', al-Hayyu, al Qoyyum al-Mutakabbir, dan al-Mujib)."},{"nama":"Akhlak","cp":"Memahami akhlak terpuji (hikmah, iffah, syaja’ah, dan ‘adalah) dan cara menghindari akhlak tercela (hubbu al-dunya, hasad, ujub, sombong beserta sifat-sifat turunannya, syahwat, licik, tamak, dzalim, dan diskriminatif)."},{"nama":"Adab","cp":"Memahami dalil dan hikmah berbakti kepada orang tua dan guru."},{"nama":"Kisah Keteladanan","cp":"Memahami keteladanan kisah Nabi Luth a.s. dan Ashabul Kahfi, dalam kesabaran, ketangguhan, dan keberanian dalam menegakkan amar ma’ruf nahi munkar."}],"F":[{"nama":"Akidah","cp":"Memahami sejarah ilmu kalam, tokoh utama dan ajaran pokok aliran-aliran Ilmu Kalam (Khawarij, Syiah, Murji'ah, Jabariyah, Qodariyah, Mu'tazilah, Ahl as-Sunnah wa al-Jama’ah (Asy'ariyah dan Maturidiyah), al-Asma’ al-Husna (al-‘Afuww, ar-Razzaq, ad-Dhaar, an-Nafi’, al-Hasib, al-Hadi, dan al Khalik), dan dalil serta fakta terkait kematian, husnul khatimah, dan su'ul khatimah."},{"nama":"Akhlak","cp":"Memahami tingkatan spiritual (syariat, tarikat, hakikat, dan ma’rifat), inti ajaran tasawuf menurut tokoh (Imam Junaid al-Baghdadi, Rabiah al Adawiyah, al-Ghazali, Syekh Abdul Qadir al-Jailani), sikap musawah (persamaan derajat), tawasuth (moderat), ukhuwah (persaudaraan), kolaboratif, fastabiq al khairat, optimis, dinamis, etika dalam berorganisasi maupun bekerja, dan cara menghindari akhlak tercela (membunuh, liwath, LGBT, meminum khamr, judi, mencuri, durhaka kepada orang tua, meninggalkan salat, memakan harta anak yatim, korupsi, israf, tabzir, bakhil, keras hati, fitnah, berita bohong (hoaks), namimah, tajassus, dan ghibah)."},{"nama":"Adab","cp":"Memahami adab berhias, dalam perjalanan, bertamu, dan menemui tamu, serta adab bergaul dengan teman sebaya, yang lebih tua, yang lebih muda, dan lawan jenis."},{"nama":"Kisah Keteladanan","cp":"Memahami keteladanan kisah para shahabat (Fatimah az-Zahra r.a., Uways al-Qarni, Abdurrahman bin Auf, Abu Dzar al-Gifari r.a.), kesufian empat Imam mazhab (Imam Hanafi, Imam Malik, Imam Asy-Syafi'i, Imam Ahmad bin Hambal), dan ulama Nusantara (Kyai Khalil al-Bangkalani, Kyai Hasyim Asy'ari, dan Kyai Ahmad Dahlan)."}]},"tujuan":"Pada praktiknya, pembelajaran Akidah Akhlak ditujukan untuk: 1. Memberikan bimbingan kepada peserta didik agar kokoh dalam akidah yang berpijak pada paham Ahlus Sunnah wal Jama’ah melalui pemberian, pemupukan, dan pengembangan pengetahuan, penghayatan, pengamalan, pembiasaan, serta pengalaman peserta didik dalam akidah Islam; 2. Mengkonstruksi ke
